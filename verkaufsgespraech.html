<title>Verkaufstraining Einzelhandel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: Startseite mit Szenario-Karten im Raster, Training als schmale Chat-Spalte mit Phasenleiste + Stimmungsbarometer, Auswertung als Kassenbon */
:root {
  --paper: #f2f4f6;
  --surface: #ffffff;
  --ink: #18202b;
  --muted: #5b6676;
  --line: #d9dee5;
  --accent: #2346a0;
  --accent-ink: #ffffff;
  --accent-soft: #e3e9f8;
  --customer: #ffffff;
  --good: #1d7a4c;
  --good-soft: #def2e7;
  --ok: #9a6400;
  --ok-soft: #fbefd6;
  --bad: #b5352a;
  --bad-soft: #f8e1de;
  --receipt: #fffdf8;
  --shadow: 0 1px 2px rgba(24, 32, 43, .06), 0 6px 18px rgba(24, 32, 43, .06);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12161c; --surface: #1b212a; --ink: #e8ecf2; --muted: #9aa5b5; --line: #2c3440;
    --accent: #7d9bf0; --accent-ink: #0f1420; --accent-soft: #232d45; --customer: #1f2630;
    --good: #5fcf94; --good-soft: #17322a; --ok: #e7b45a; --ok-soft: #352a14; --bad: #f08a7e; --bad-soft: #3a1f1c;
    --receipt: #1e232b; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #12161c; --surface: #1b212a; --ink: #e8ecf2; --muted: #9aa5b5; --line: #2c3440;
  --accent: #7d9bf0; --accent-ink: #0f1420; --accent-soft: #232d45; --customer: #1f2630;
  --good: #5fcf94; --good-soft: #17322a; --ok: #e7b45a; --ok-soft: #352a14; --bad: #f08a7e; --bad-soft: #3a1f1c;
  --receipt: #1e232b; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 1.0625rem;
  line-height: 1.55;
}
.wrap { max-width: 980px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; display: grid; gap: 20px; }
.narrow { max-width: 760px; width: 100%; justify-self: center; display: grid; gap: 18px; }

.brand { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
.brand h1 {
  font-family: var(--f-display); font-weight: 800; font-size: clamp(1.6rem, 4.5vw, 2.3rem);
  line-height: 1.05; margin: 0; letter-spacing: -.01em; text-wrap: balance;
}
.brand .shop { font-family: var(--f-mono); font-size: .8rem; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; display: block; margin-top: 4px; }
.label { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }

/* Startseite */
.lead { margin: 0; max-width: 66ch; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: space-between; }
.mode { display: inline-flex; border: 1.5px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); }
.mode button {
  font: inherit; font-size: .92rem; font-weight: 700; border: 0; background: transparent; color: var(--muted);
  padding: 6px 14px; border-radius: 999px; cursor: pointer;
}
.mode button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.mode-hint { font-size: .9rem; color: var(--muted); max-width: 46ch; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.card {
  font: inherit; color: inherit; text-align: left; cursor: pointer;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 16px;
  display: grid; grid-template-rows: auto auto 1fr auto; gap: 8px; box-shadow: var(--shadow);
  transition: border-color .15s, transform .2s, box-shadow .2s;
}
.card:hover { border-color: var(--accent); transform: translateY(-3px); box-shadow: 0 2px 4px rgba(24,32,43,.08), 0 12px 26px rgba(24,32,43,.1); }
.cards .card { animation: rise .45s cubic-bezier(.2,.8,.2,1) both; }
.card:active { transform: translateY(1px); }
.card .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.tag {
  font-size: .75rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  padding: 3px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent);
}
.dots { display: inline-flex; gap: 3px; align-items: center; font-size: .75rem; color: var(--muted); }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); display: inline-block; }
.dots i.on { background: var(--ink); }
.dots span { margin-left: 5px; }
.card h3 { font-family: var(--f-display); font-size: 1.2rem; margin: 0; line-height: 1.2; text-wrap: balance; }
.card p { margin: 0; font-size: .95rem; color: var(--muted); }
.card .foot { display: flex; justify-content: space-between; gap: 8px; align-items: center; border-top: 1px dashed var(--line); padding-top: 8px; font-size: .88rem; }
.card .shopname { font-family: var(--f-mono); font-size: .78rem; color: var(--muted); }
.best { font-family: var(--f-mono); font-weight: 600; font-variant-numeric: tabular-nums; }
.best.none { color: var(--muted); font-weight: 400; }

/* Training */
.status { display: grid; grid-template-columns: 1fr auto; gap: 12px 20px; align-items: end; }
@media (max-width: 560px) { .status { grid-template-columns: 1fr; } }
.phases { list-style: none; margin: 6px 0 0; padding: 0; display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
.phases li { height: 8px; border-radius: 4px; background: var(--line); }
.phases li.done { background: var(--accent); }
.phases li.now { background: var(--accent); opacity: .45; }
.phase-name { font-family: var(--f-display); font-weight: 700; font-size: 1rem; margin-top: 6px; min-height: 1.5em; }
.mood { min-width: 210px; }
.mood-row { display: flex; align-items: center; gap: 10px; margin-top: 6px; position: relative; }
.mood-bar.flash-good { animation: flash-good .7s ease; }
.mood-bar.flash-bad { animation: flash-bad .7s ease; }
.delta {
  position: absolute; right: 0; top: -4px; font-family: var(--f-mono); font-weight: 600; font-size: .95rem;
  pointer-events: none; animation: float-up 1.3s ease-out both;
}
.delta.up { color: var(--good); } .delta.down { color: var(--bad); }
.mood-bar { flex: 1; height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
.mood-fill { height: 100%; width: 50%; background: var(--ok); transition: width .5s ease, background-color .5s ease; }
.mood-face { font-family: var(--f-mono); font-size: .9rem; font-weight: 600; min-width: 5.5em; text-align: right; }

.intro {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; box-shadow: var(--shadow);
  display: grid; gap: 12px;
}
.intro h2 { font-family: var(--f-display); font-size: 1.35rem; margin: 0; text-wrap: balance; }
.intro p { margin: 0; max-width: 64ch; }
.profile { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: .95rem; }
.profile dt { color: var(--muted); font-weight: 700; }
.profile dd { margin: 0; min-width: 0; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.fact { border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; font-size: .95rem; }
.fact b { display: block; font-family: var(--f-display); }
.fact .price { font-family: var(--f-mono); font-variant-numeric: tabular-nums; color: var(--muted); font-size: .85rem; }

.chat { display: grid; gap: 12px; }
.note { justify-self: center; text-align: center; max-width: 60ch; font-size: .92rem; color: var(--muted); font-style: italic; padding: 2px 8px; margin: 0; }
.note strong { font-style: normal; color: var(--ink); }
.clock { font-family: var(--f-mono); font-style: normal; font-weight: 600; color: var(--bad); }
.msg { display: grid; gap: 4px; max-width: 86%; }
.msg.customer { animation: in-left .35s cubic-bezier(.2,.8,.2,1) both; }
.msg.seller { animation: in-right .35s cubic-bezier(.2,.8,.2,1) both; }
.typing { display: inline-flex; gap: 5px; padding: 14px 16px; }
.typing i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); animation: blink 1s infinite ease-in-out; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
.note { animation: fade .4s ease both; }
.choices .choice { animation: rise .35s cubic-bezier(.2,.8,.2,1) both; }
.choices .choice:nth-child(2) { animation-delay: .08s; } .choices .choice:nth-child(3) { animation-delay: .16s; }
.choice.picked { border-color: var(--accent); background: var(--accent-soft); }
.choice:disabled { cursor: default; }
.choices.locked .choice:not(.picked) { opacity: .35; transition: opacity .25s; }
.msg .who { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.msg .bubble { padding: 10px 14px; border-radius: 16px; min-width: 0; overflow-wrap: anywhere; }
.msg.customer { justify-self: start; }
.msg.customer .bubble { background: var(--customer); border: 1px solid var(--line); border-top-left-radius: 4px; }
.msg.seller { justify-self: end; text-align: right; }
.msg.seller .bubble { background: var(--accent); color: var(--accent-ink); border-top-right-radius: 4px; text-align: left; }

.feedback { border-radius: 12px; padding: 12px 14px; display: grid; gap: 4px; font-size: .95rem; border: 1px solid transparent; animation: pop .3s ease both; }
.feedback.good { animation: bounce .5s cubic-bezier(.3,1.6,.5,1) both; }
.feedback.bad { animation: shake .45s ease both; }
.feedback .verdict { font-family: var(--f-display); font-weight: 700; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.feedback .pts { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-weight: 600; }
.feedback.good { background: var(--good-soft); border-color: var(--good); }
.feedback.good .verdict { color: var(--good); }
.feedback.ok { background: var(--ok-soft); border-color: var(--ok); }
.feedback.ok .verdict { color: var(--ok); }
.feedback.bad { background: var(--bad-soft); border-color: var(--bad); }
.feedback.bad .verdict { color: var(--bad); }
.feedback .tip { color: var(--ink); }

.dock { position: sticky; bottom: env(safe-area-inset-bottom, 0px); background: var(--paper); padding-block: 10px 4px; display: grid; gap: 10px; border-top: 1px solid var(--line); }
.dock .ask { font-family: var(--f-display); font-weight: 700; font-size: 1rem; }
.choices { display: grid; gap: 8px; }
.choice {
  font: inherit; font-size: 1rem; text-align: left; cursor: pointer;
  background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); border-radius: 12px;
  padding: 11px 14px; display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start;
  transition: border-color .15s, background-color .15s, transform .1s;
}
.choice:hover { border-color: var(--accent); background: var(--accent-soft); }
.choice:active { transform: translateY(1px); }
.choice .key {
  font-family: var(--f-mono); font-weight: 600; font-size: .85rem; color: var(--accent);
  border: 1.5px solid currentColor; border-radius: 6px; width: 1.8em; height: 1.8em; display: grid; place-items: center;
}
.btn {
  font: inherit; font-family: var(--f-display); font-weight: 700; font-size: 1rem; cursor: pointer;
  background: var(--accent); color: var(--accent-ink); border: 1.5px solid var(--accent); border-radius: 12px; padding: 11px 20px;
}
.btn.ghost { background: transparent; color: var(--accent); }
.btn.small { font-size: .9rem; padding: 7px 14px; border-radius: 10px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Auswertung */
.receipt {
  background: var(--receipt); color: var(--ink); font-family: var(--f-mono); font-size: .88rem;
  max-width: 460px; width: 100%; justify-self: center; padding: 22px 20px 26px; box-shadow: var(--shadow);
  animation: print 1.1s steps(14, end) both;
  -webkit-mask: radial-gradient(circle 6px at 50% 100%, transparent 98%, #000) 0 0 / 14px 100% repeat-x;
          mask: radial-gradient(circle 6px at 50% 100%, transparent 98%, #000) 0 0 / 14px 100% repeat-x;
}
.receipt h3 { text-align: center; margin: 0 0 2px; font-size: 1rem; letter-spacing: .1em; text-transform: uppercase; }
.receipt .center { text-align: center; color: var(--muted); }
.receipt hr { border: 0; border-top: 1.5px dashed var(--line); margin: 12px 0; }
.receipt .row { display: grid; grid-template-columns: 1fr auto; gap: 12px; font-variant-numeric: tabular-nums; }
.receipt .row + .row { margin-top: 4px; }
.receipt .row .sub { color: var(--muted); font-size: .8rem; display: block; }
.receipt .total { font-weight: 600; font-size: 1rem; }
.receipt .grade { text-align: center; font-family: var(--f-display); font-size: 1.6rem; font-weight: 800; margin-top: 4px; animation: bounce .6s 1.1s cubic-bezier(.3,1.6,.5,1) both; }
.receipt .verdict-text { text-align: center; font-family: var(--f-body); font-size: .95rem; margin-top: 6px; }
.r-good { color: var(--good); } .r-ok { color: var(--ok); } .r-bad { color: var(--bad); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; display: grid; gap: 10px; }
.panel h3 { font-family: var(--f-display); margin: 0; font-size: 1.15rem; }
.panel ol, .panel ul { margin: 0; padding-left: 1.4em; display: grid; gap: 6px; }
.panel li { max-width: 66ch; }
.panel li b { font-family: var(--f-display); }
.review { display: grid; gap: 12px; }
.review-item { display: grid; gap: 4px; padding-bottom: 12px; border-bottom: 1px dashed var(--line); }
.review-item:last-child { border-bottom: 0; padding-bottom: 0; }
.review-item .head { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-family: var(--f-display); font-weight: 700; }
.review-item .said { font-style: italic; color: var(--muted); }
.review-item .tip { font-size: .95rem; }
details summary { cursor: pointer; font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; }
details[open] summary { margin-bottom: 10px; }

@keyframes pop { from { opacity: .3; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes in-left { from { opacity: 0; transform: translateX(-18px) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes in-right { from { opacity: 0; transform: translateX(18px) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes blink { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
@keyframes bounce { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: none; } }
@keyframes shake { 0% { opacity: 0; } 20% { opacity: 1; transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } 100% { transform: none; } }
@keyframes float-up { from { opacity: 0; transform: translateY(6px); } 20% { opacity: 1; } to { opacity: 0; transform: translateY(-26px); } }
@keyframes flash-good { 40% { box-shadow: 0 0 0 4px var(--good-soft); } }
@keyframes flash-bad { 40% { box-shadow: 0 0 0 4px var(--bad-soft); } }
@keyframes print { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }
@keyframes fall { from { transform: translate3d(0, -20px, 0) rotate(0deg); opacity: 1; } to { transform: translate3d(var(--dx), 105vh, 0) rotate(var(--rot)); opacity: .9; } }
.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 10; }
.confetti i { position: absolute; top: 0; width: 9px; height: 14px; border-radius: 2px; animation: fall linear both; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<div class="wrap">
  <header class="brand">
    <div>
      <h1>Verkaufstraining Einzelhandel</h1>
      <span class="shop" id="subline">Verkaufsgespräche üben · 8 Phasen · 5 Szenarien</span>
    </div>
    <button class="btn ghost small" type="button" id="home-btn" hidden>Alle Szenarien</button>
  </header>

  <section id="home" class="narrow" style="max-width:none"></section>

  <section id="play" class="narrow" hidden>
    <div class="status">
      <div>
        <div class="label" id="phase-label">Phase 1 von 8</div>
        <ol class="phases" id="phases" aria-hidden="true"></ol>
        <div class="phase-name" id="phase-name"></div>
      </div>
      <div class="mood">
        <div class="label">Kundenstimmung</div>
        <div class="mood-row">
          <div class="mood-bar" role="meter" aria-label="Kundenstimmung" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" id="mood-bar">
            <div class="mood-fill" id="mood-fill"></div>
          </div>
          <span class="mood-face" id="mood-face">neutral</span>
        </div>
      </div>
    </div>
    <main class="chat" id="chat" aria-live="polite"></main>
    <section class="dock" id="dock"></section>
  </section>
</div>

<script>
(function () {
  // ---------------------------------------------------------------
  // Szenarien. Jede Antwort: s = Punkte (2 gut, 1 mittel, 0 ungünstig),
  // t = was Sie sagen/tun, r = Reaktion der Kundschaft, tip = Feedback,
  // rev = optionaler Umsatz zusätzlich zum Grundumsatz.
  // ---------------------------------------------------------------
  const SCENARIOS = [
    {
      id: "laufschuhe",
      title: "Laufschuhe für die Einsteigerin",
      tag: "Einsteigerin",
      level: 1,
      shop: "Sporthaus Laufwerk",
      who: "Frau Becker",
      teaser: "Eine Kundin will mit dem Laufen anfangen und hat Knieprobleme. Ein Gespräch zum Kennenlernen der acht Phasen.",
      profile: [["Kundin", "Frau Becker, ca. 40 Jahre"], ["Situation", "will mit dem Laufen anfangen, kennt sich nicht aus"], ["Stimmung", "offen und freundlich"]],
      startMood: 50,
      revenue: 89.95,
      products: [
        ["Basic Jog", "39,95 €", "einfacher Freizeitschuh, wenig Dämpfung"],
        ["AeroRun 3", "89,95 €", "Einsteiger-Laufschuh, starke Dämpfung, für Asphalt"],
        ["PacePro Carbon", "179,95 €", "Wettkampfschuh mit Carbonplatte"],
        ["Laufsocken Comfort", "12,95 €", "gepolstert, schützen vor Blasen"]
      ],
      specials: [
        "Einsteiger brauchen Orientierung: erst den Bedarf klären, dann wenige passende Artikel zeigen.",
        "Fachbegriffe immer in einen Nutzen übersetzen.",
        "Ausprobieren lassen (Laufband) überzeugt mehr als jede Beschreibung."
      ],
      steps: [
        { phase: "Kontaktaufnahme",
          situation: "Eine Kundin steht seit einer Minute vor dem Laufschuhregal und nimmt immer wieder einen Schuh in die Hand. Sie sind gerade frei.",
          ask: "Wie sprechen Sie die Kundin an?",
          options: [
            { s: 2, t: "(gehen hin, lächeln) „Guten Tag! Das ist unser AeroRun, ein sehr beliebter Laufschuh. Laufen Sie eher auf der Straße oder im Gelände?“",
              r: "Hallo! Auf der Straße. Ich will mit dem Laufen anfangen und habe ehrlich gesagt keine Ahnung, worauf ich achten muss.",
              tip: "Sie haben die Kundin <b>warenbezogen</b> angesprochen: Sie knüpfen an den Artikel in ihrer Hand an und stellen gleich eine Frage. So kommt sofort ein Gespräch zustande." },
            { s: 1, t: "„Kann ich Ihnen helfen?“",
              r: "Ähm … ich schaue eigentlich nur. Na ja, ich suche Laufschuhe. Ich will mit dem Laufen anfangen.",
              tip: "Freundlich, aber eine <b>geschlossene Frage</b>. Auf „Kann ich helfen?“ antworten viele reflexartig mit „Nein, ich schaue nur“. Besser: an die Ware anknüpfen." },
            { s: 0, t: "(rufen von der Kasse) „Wenn was ist, melden Sie sich einfach!“",
              r: "(kommt nach einer Weile zur Kasse) Entschuldigung … ich suche Laufschuhe. Ich will mit dem Laufen anfangen.",
              tip: "Zurufen aus der Distanz wirkt desinteressiert. Gehen Sie hin, halten Sie <b>Blickkontakt</b> und begrüßen Sie freundlich." }
          ] },
        { phase: "Bedarfsermittlung",
          situation: "Die Kundin möchte mit dem Laufen beginnen. Bevor Sie Ware zeigen, müssen Sie wissen, was sie braucht.",
          ask: "Was fragen Sie?",
          options: [
            { s: 2, t: "„Wie oft möchten Sie denn laufen, wie lange ungefähr und auf welchem Untergrund? Gibt es Beschwerden, auf die wir achten sollten?“",

        { phase: "Verkaufsargumentation",

        { phase: "Preisnennung",

            { s: 0, t: "„49,90 für 30 ml, aber die große Flasche mit 50 ml für 79,90 lohnt sich viel mehr.“",

          ] },
        { phase: "Einwandbehandlung",

              r: "Ah, wenn sie umtauschen kann, dann trau ich mich.",

          ] },
        { phase: "Ergänzungsangebot",
          situation: "Sie lächelt erleichtert.",
          customer: "Okay, ich nehme das Jardin Blanc.",
          ask: "Was bieten Sie an?",
          options: [
            { s: 2, rev: 3.5, t: "„Schöne Wahl! Ich packe es Ihnen gratis als Geschenk ein. Möchten Sie noch eine passende Grußkarte für 3,50 Euro dazu? Dann ist das Geschenk komplett.“",
              r: "Oh ja, die mit den Blumen, bitte!",
              tip: "<b>Service</b> (Verpackung) plus eine kleine, passende Ergänzung, die ins Budget passt." },
            { s: 1, t: "„Gut, dann kommen Sie mit zur Kasse.“",
              r: "Okay.",
              tip: "Kein Fehler, aber bei einem Geschenk sind Verpackung und Karte naheliegender Service." },
            { s: 0, t: "„Wollen Sie für sich auch noch was? Die Wimperntusche ist gerade im Angebot.“",
              r: "Ähm, nein, ich wollte nur das Geschenk.",
              tip: "Die Ergänzung passt nicht zum <b>Kaufanlass</b> und nicht zum knappen Budget." }
          ] },
        { phase: "Abschluss & Verabschiedung",
          situation: "Lea nimmt die hübsch verpackte Schachtel entgegen.",
          ask: "Wie verabschieden Sie sich?",
          options: [
            { s: 2, t: "„Ihre Mutter wird sich bestimmt freuen. Alles Gute zum Geburtstag an sie und ein schönes Wochenende!“",
              r: "Danke, Sie haben mir echt geholfen. Jetzt freu ich mich selbst auf Samstag!",
              tip: "Die <b>Entscheidung wird bestätigt</b>, und der Anlass wird aufgegriffen. Genau das braucht eine unsichere Kundin." },
            { s: 1, t: "„Danke, tschüss.“",
              r: "Tschüss.",
              tip: "Höflich, aber gerade hier hätte eine Bestätigung der Entscheidung gutgetan." },
            { s: 0, t: "„So, endlich entschieden, was?“",
              r: "(lacht verlegen) Ja … tschüss.",
              tip: "Eine <b>spitze Bemerkung</b> über ihre Unentschlossenheit beschämt die Kundin." }
          ] }
      ]
    }
  ];

  const PHASE_RULES = [
    ["Kontaktaufnahme", "hingehen, Blickkontakt, freundlich begrüßen, am besten warenbezogen ansprechen."],
    ["Bedarfsermittlung", "offene W-Fragen stellen, aktiv zuhören, ausreden lassen."],
    ["Warenvorlage", "2–3 passende Artikel, mittlere Preislage, Ware in die Hand geben."],
    ["Verkaufsargumentation", "Eigenschaft → Vorteil → Nutzen, im Sie-Stil."],
    ["Preisnennung", "Sandwich-Methode (Nutzen – Preis – Nutzen), nie entschuldigen."],
    ["Einwandbehandlung", "Einwände ernst nehmen, z. B. mit der Ja-aber-Methode."],
    ["Ergänzungsangebot", "ein passender Artikel mit klarem Nutzen, nach dem Kaufentschluss."],
    ["Abschluss & Verabschiedung", "Kauf bestätigen, Tipp geben, persönlich verabschieden."]
  ];

  const RATING = {
    2: { cls: "good", label: "Sehr gut" },
    1: { cls: "ok", label: "Geht besser" },
    0: { cls: "bad", label: "Ungünstig" }
  };
  const LEVELS = { 1: "leicht", 2: "mittel", 3: "schwer" };
  const MAX = 16;
  const STORE_KEY = "verkaufstraining-best-v1";
  const MODE_KEY = "verkaufstraining-mode-v1";

  const $ = id => document.getElementById(id);
  const homeEl = $("home"), playEl = $("play"), chat = $("chat"), dock = $("dock");
  const phasesEl = $("phases"), phaseLabel = $("phase-label"), phaseName = $("phase-name");
  const moodFill = $("mood-fill"), moodFace = $("mood-face"), moodBar = $("mood-bar");
  const homeBtn = $("home-btn"), subline = $("subline");

  let sc = null;      // aktuelles Szenario
  let state = null;   // Spielstand
  let mode = readMode();
  let runCounter = 0;
  const calm = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------- Speicher (nur in diesem Browser) ----------
  function readBest() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { return {}; }
  }
  function saveBest(id, points, note) {
    try {
      const all = readBest();
      if (!all[id] || points > all[id].points) {
        all[id] = { points, note };
        localStorage.setItem(STORE_KEY, JSON.stringify(all));
      }
    } catch (e) { /* ohne Speicher weiterspielen */ }
  }
  function readMode() {
    try { return localStorage.getItem(MODE_KEY) === "pruefung" ? "pruefung" : "uebung"; } catch (e) { return "uebung"; }
  }
  function saveMode(m) { try { localStorage.setItem(MODE_KEY, m); } catch (e) {} }

  // ---------- Hilfen ----------
  function el(tag, cls, html) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }
  function shuffle(a) {
    const r = a.slice();
    for (let i = r.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [r[i], r[j]] = [r[j], r[i]];
    }
    return r;
  }
  function euro(v) { return v.toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €"; }
  function dots(level) {
    let h = "<span class=\"dots\" title=\"Schwierigkeit\">";
    for (let i = 1; i <= 3; i++) h += "<i class=\"" + (i <= level ? "on" : "") + "\"></i>";
    return h + "<span>" + LEVELS[level] + "</span></span>";
  }
  function scrollDown() { requestAnimationFrame(() => dock.scrollIntoView({ block: "end", behavior: "smooth" })); }
  function moodDelta(score) {
    if (score === 2) return 15;
    if (score === 1) return sc.harsh ? -8 : -5;
    return sc.harsh ? -25 : -20;
  }

  // ---------- Startseite ----------
  function showHome() {
    runCounter++;
    sc = null; state = { run: -1 };
    playEl.hidden = true; homeEl.hidden = false; homeBtn.hidden = true;
    subline.textContent = "Verkaufsgespräche üben · 8 Phasen · " + SCENARIOS.length + " Szenarien";
    homeEl.innerHTML = "";

    homeEl.appendChild(el("p", "lead",
      "Wählen Sie ein Szenario und führen Sie das Verkaufsgespräch von der Begrüßung bis zur Verabschiedung. In jeder der acht Phasen entscheiden Sie sich für eine von drei Antworten. Die Kundschaft reagiert darauf, und am Ende gibt es eine Auswertung mit Note."));

    const bar = el("div", "toolbar");
    const left = el("div");
    left.appendChild(el("div", "label", "Modus"));
    const m = el("div", "mode");
    m.setAttribute("role", "group");
    m.setAttribute("aria-label", "Modus wählen");
    [["uebung", "Übung"], ["pruefung", "Prüfung"]].forEach(([k, label]) => {
      const b = el("button", null, label);
      b.type = "button";
      b.id = "mode-" + k;
      b.setAttribute("aria-pressed", String(mode === k));
      b.addEventListener("click", () => { mode = k; saveMode(k); showHome(); });
      m.appendChild(b);
    });
    left.appendChild(m);
    bar.appendChild(left);
    bar.appendChild(el("div", "mode-hint", mode === "uebung"
      ? "<b>Übung:</b> Nach jeder Antwort sehen Sie sofort, ob sie gut war und warum."
      : "<b>Prüfung:</b> Die Rückmeldung kommt erst am Ende, wie in einer echten Prüfungssituation."));
    const rnd = el("button", "btn ghost small", "Zufälliges Szenario");
    rnd.type = "button";
    rnd.id = "random-btn";
    rnd.addEventListener("click", () => startScenario(SCENARIOS[Math.floor(Math.random() * SCENARIOS.length)]));
    bar.appendChild(rnd);
    homeEl.appendChild(bar);

    const best = readBest();
    const grid = el("div", "cards");
    SCENARIOS.forEach(s => {
      const c = el("button", "card");
      c.type = "button";
      c.id = "card-" + s.id;
      const b = best[s.id];
      c.innerHTML =
        "<div class=\"top\"><span class=\"tag\">" + s.tag + "</span>" + dots(s.level) + "</div>" +
        "<h3>" + s.title + "</h3>" +
        "<p>" + s.teaser + "</p>" +
        "<div class=\"foot\"><span class=\"shopname\">" + s.shop + "</span>" +
        (b ? "<span class=\"best\">Bestwert: " + b.points + "/" + MAX + " · Note " + b.note + "</span>"
           : "<span class=\"best none\">noch nicht gespielt</span>") + "</div>";
      c.style.animationDelay = (grid.children.length * 70) + "ms";
      c.addEventListener("click", () => startScenario(s));
      grid.appendChild(c);
    });
    homeEl.appendChild(grid);
  }

  // ---------- Szenario ----------
  function startScenario(s) {
    sc = s;
    runCounter++;
    state = { step: 0, points: 0, mood: s.startMood, results: [], over: false, left: false, revenue: s.revenue, busy: false, run: runCounter };
    homeEl.hidden = true; playEl.hidden = false; homeBtn.hidden = false;
    subline.textContent = s.shop + " · " + s.tag + " · " + (mode === "uebung" ? "Übungsmodus" : "Prüfungsmodus");
    chat.innerHTML = "";
    renderPhases(); renderMood();

    const box = el("section", "intro");
    box.appendChild(el("h2", null, s.title));
    box.appendChild(el("p", null, s.teaser));
    const dl = el("dl", "profile");
    s.profile.forEach(([k, v]) => { dl.appendChild(el("dt", null, k)); dl.appendChild(el("dd", null, v)); });
    box.appendChild(dl);
    box.appendChild(el("p", "label", "Sortiment im Gespräch"));
    const facts = el("div", "facts");
    s.products.forEach(([n, p, i]) => facts.appendChild(el("div", "fact", "<b>" + n + "</b><span class=\"price\">" + p + "</span><br>" + i)));
    box.appendChild(facts);
    chat.appendChild(box);

    dock.innerHTML = "";
    const go = el("button", "btn", "Gespräch starten");
    go.type = "button";
    go.id = "start-btn";
    go.addEventListener("click", () => { chat.innerHTML = ""; showStep(); });
    dock.appendChild(go);
    window.scrollTo({ top: 0 });
  }

  function renderPhases() {
    phasesEl.innerHTML = "";
    sc.steps.forEach((_, i) => {
      const li = el("li");
      if (i < state.step) li.classList.add("done");
      else if (i === state.step && !state.over) li.classList.add("now");
      phasesEl.appendChild(li);
    });
    if (state.over) {
      phaseLabel.textContent = "Gespräch beendet";
      phaseName.textContent = "Auswertung";
    } else {
      phaseLabel.textContent = "Phase " + (state.step + 1) + " von " + sc.steps.length;
      phaseName.textContent = sc.steps[state.step].phase;
    }
  }

  function renderMood() {
    const m = state.mood;
    moodFill.style.width = m + "%";
    moodBar.setAttribute("aria-valuenow", m);
    let word, color;
    if (m >= 75) { word = "begeistert"; color = "var(--good)"; }
    else if (m >= 55) { word = "zufrieden"; color = "var(--good)"; }
    else if (m >= 35) { word = "neutral"; color = "var(--ok)"; }
    else if (m >= 15) { word = "genervt"; color = "var(--bad)"; }
    else { word = "verärgert"; color = "var(--bad)"; }
    moodFill.style.backgroundColor = color;
    moodFace.textContent = word;
  }

  function addNote(html) { chat.appendChild(el("p", "note", html)); }
  function addMsg(who, text) {
    const m = el("div", "msg " + who);
    m.appendChild(el("span", "who", who === "seller" ? "Sie" : sc.who));
    m.appendChild(el("div", "bubble", text));
    chat.appendChild(m);
    return m;
  }
  function addTyping() {
    const m = el("div", "msg customer");
    m.setAttribute("aria-label", sc.who + " antwortet");
    m.appendChild(el("span", "who", sc.who));
    m.appendChild(el("div", "bubble typing", "<i></i><i></i><i></i>"));
    chat.appendChild(m);
    return m;
  }
  function showDelta(d) {
    if (!d) return;
    const tag = el("span", "delta " + (d > 0 ? "up" : "down"), (d > 0 ? "+" : "−") + Math.abs(d));
    moodBar.parentElement.appendChild(tag);
    setTimeout(() => tag.remove(), 1400);
    moodBar.classList.remove("flash-good", "flash-bad");
    void moodBar.offsetWidth;
    moodBar.classList.add(d > 0 ? "flash-good" : "flash-bad");
  }
  function confetti() {
    if (calm) return;
    const box = el("div", "confetti");
    box.setAttribute("aria-hidden", "true");
    const colors = ["var(--accent)", "var(--good)", "var(--ok)", "var(--bad)"];
    for (let i = 0; i < 60; i++) {
      const p = el("i");
      p.style.left = Math.random() * 100 + "%";
      p.style.background = colors[i % colors.length];
      p.style.setProperty("--dx", (Math.random() * 160 - 80) + "px");
      p.style.setProperty("--rot", (Math.random() * 720 - 360) + "deg");
      p.style.animationDuration = (1.8 + Math.random() * 1.6) + "s";
      p.style.animationDelay = (Math.random() * .5) + "s";
      box.appendChild(p);
    }
    document.body.appendChild(box);
    setTimeout(() => box.remove(), 4200);
  }
  function countUp(node, target) {
    if (calm || !node) return;
    const t0 = performance.now(), dur = 900;
    node.textContent = "0";
    const tick = now => {
      const k = Math.min(1, (now - t0) / dur);
      node.textContent = String(Math.round(target * (1 - Math.pow(1 - k, 3))));
      if (k < 1) requestAnimationFrame(tick);
    };
    setTimeout(() => requestAnimationFrame(tick), 900);
  }

  function showStep() {
    const s = sc.steps[state.step];
    renderPhases();
    addNote((s.clock ? "<span class=\"clock\">" + s.clock + " Uhr</span> · " : "") + "<strong>" + s.phase + ".</strong> " + s.situation);
    if (s.customer) addMsg("customer", s.customer);

    dock.innerHTML = "";
    dock.appendChild(el("div", "ask", s.ask));
    const list = el("div", "choices");
    shuffle(s.options).forEach((opt, i) => {
      const b = el("button", "choice");
      b.type = "button";
      b.id = "choice-" + state.step + "-" + i;
      b.innerHTML = "<span class=\"key\">" + "ABC"[i] + "</span><span>" + opt.t + "</span>";
      b.addEventListener("click", () => choose(opt, b));
      list.appendChild(b);
    });
    dock.appendChild(list);
    scrollDown();
  }

  function feedbackBox(opt) {
    const r = RATING[opt.s];
    const fb = el("div", "feedback " + r.cls);
    fb.appendChild(el("div", "verdict", "<span>" + r.label + "</span><span class=\"pts\">+" + opt.s + " / 2 Punkte</span>"));
    fb.appendChild(el("div", "tip", opt.tip));
    return fb;
  }

  async function choose(opt, btn) {
    if (state.busy) return;
    state.busy = true;
    const run = state.run;
    const list = btn.parentElement;
    list.classList.add("locked");
    btn.classList.add("picked");
    list.querySelectorAll("button").forEach(b => { b.disabled = true; });

    const s = sc.steps[state.step];
    const before = state.mood;
    state.results.push({ phase: s.phase, opt });
    state.points += opt.s;
    state.revenue += opt.rev || 0;
    state.mood = Math.max(0, Math.min(100, state.mood + moodDelta(opt.s)));

    await wait(250);
    if (run !== state.run) return;
    addMsg("seller", opt.t);
    scrollDown();
    await wait(300);
    if (run !== state.run) return;
    const typing = addTyping();
    scrollDown();
    await wait(800 + Math.min(900, opt.r.length * 8));
    if (run !== state.run) return;
    typing.remove();
    addMsg("customer", opt.r);
    renderMood();
    showDelta(state.mood - before);
    if (mode === "uebung") { await wait(350); if (run !== state.run) return; chat.appendChild(feedbackBox(opt)); }
    state.busy = false;

    state.step++;
    const done = state.step >= sc.steps.length;
    const left = !done && state.mood <= 0;
    dock.innerHTML = "";
    if (left) {
      addMsg("customer", "Wissen Sie was … ich überlege mir das noch mal. Auf Wiedersehen.");
      addNote("<strong>Die Kundschaft verlässt das Geschäft.</strong> Die Stimmung ist auf dem Tiefpunkt.");
      state.left = true;
    }
    const next = el("button", "btn", left || done ? "Zur Auswertung" : "Weiter");
    next.type = "button";
    next.id = "next-btn";
    next.addEventListener("click", () => (left || done) ? showResult() : showStep());
    dock.appendChild(next);
    scrollDown();
    next.focus({ preventScroll: true });
  }

  function wait(ms) { return new Promise(r => setTimeout(r, calm ? 0 : ms)); }

  function grade(points, left) {
    if (left) return { note: "6", text: "Die Kundschaft ist gegangen. Kein Verkauf! Lesen Sie die Hinweise und versuchen Sie es noch einmal." };
    const p = points / MAX;
    if (p >= 0.92) return { note: "1", text: "Verkaufsprofi! Sie haben bedarfsgerecht beraten und die Kundschaft an sich gebunden." };
    if (p >= 0.81) return { note: "2", text: "Sehr ordentlich. Mit ein paar Feinheiten wird das ein Spitzengespräch." };
    if (p >= 0.67) return { note: "3", text: "Solide Grundlage. Achten Sie besonders auf die Phasen mit wenig Punkten." };
    if (p >= 0.50) return { note: "4", text: "Verkauft, aber mit Glück. Wiederholen Sie die Theorie der schwachen Phasen." };
    if (p >= 0.30) return { note: "5", text: "Die Kundschaft war wenig überzeugt. Lesen Sie die Hinweise und starten Sie neu." };
    return { note: "6", text: "Da ist noch viel Luft nach oben. Probieren Sie es gleich noch einmal!" };
  }

  function showResult() {
    state.over = true;
    renderPhases();
    dock.innerHTML = "";

    const g = grade(state.points, state.left);
    saveBest(sc.id, state.left ? 0 : state.points, g.note);
    const now = new Date();
    const stamp = now.toLocaleDateString("de-DE") + " " + now.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });

    const rc = el("section", "receipt");
    rc.setAttribute("aria-label", "Auswertung");
    let h = "<h3>" + sc.shop + "</h3><div class=\"center\">Auswertung Verkaufsgespräch<br>" + sc.title + "<br>" + stamp + "</div><hr>";
    sc.steps.forEach((s, i) => {
      const r = state.results[i];
      if (r) {
        const rt = RATING[r.opt.s];
        h += "<div class=\"row\"><span>" + s.phase + "<span class=\"sub r-" + rt.cls + "\">" + rt.label + "</span></span><span>" + r.opt.s + ",0 P</span></div>";
      } else {
        h += "<div class=\"row\"><span>" + s.phase + "<span class=\"sub\">nicht erreicht</span></span><span>–</span></div>";
      }
    });
    h += "<hr><div class=\"row total\"><span>SUMME</span><span><span id=\"sum-count\">" + state.points + "</span> / " + MAX + " P</span></div>";
    h += "<div class=\"row\"><span>Kundenstimmung</span><span>" + state.mood + " %</span></div>";
    h += "<div class=\"row\"><span>Umsatz</span><span>" + (state.left ? euro(0) : euro(state.revenue)) + "</span></div>";
    h += "<hr><div class=\"center\">Note</div><div class=\"grade\">" + g.note + "</div><div class=\"verdict-text\">" + g.text + "</div>";
    rc.innerHTML = h;
    chat.appendChild(rc);
    countUp(rc.querySelector("#sum-count"), state.points);
    if (!state.left && (g.note === "1" || g.note === "2")) setTimeout(confetti, 1100);

    const sp = el("section", "panel");
    sp.appendChild(el("h3", null, "Darauf kommt es an: " + sc.tag));
    sp.appendChild(el("ul", null, sc.specials.map(t => "<li>" + t + "</li>").join("")));
    chat.appendChild(sp);

    const rv = el("details", "panel");
    if (mode === "pruefung") rv.open = true;
    rv.appendChild(el("summary", null, "Ihre Antworten im Detail"));
    const list = el("div", "review");
    state.results.forEach(r => {
      const rt = RATING[r.opt.s];
      const it = el("div", "review-item");
      it.appendChild(el("div", "head", "<span>" + r.phase + "</span><span class=\"r-" + rt.cls + "\">" + rt.label + " · " + r.opt.s + "/2</span>"));
      it.appendChild(el("div", "said", r.opt.t));
      it.appendChild(el("div", "tip", r.opt.tip));
      list.appendChild(it);
    });
    rv.appendChild(list);
    chat.appendChild(rv);

    const ru = el("details", "panel");
    ru.appendChild(el("summary", null, "Merksätze: die 8 Phasen des Verkaufsgesprächs"));
    ru.appendChild(el("ol", null, PHASE_RULES.map(([k, v]) => "<li><b>" + k + ":</b> " + v + "</li>").join("")));
    chat.appendChild(ru);

    const row = el("div", "btn-row");
    const again = el("button", "btn", "Noch einmal spielen");
    again.type = "button";
    again.id = "again-btn";
    again.addEventListener("click", () => startScenario(sc));
    const other = el("button", "btn ghost", "Anderes Szenario");
    other.type = "button";
    other.id = "other-btn";
    other.addEventListener("click", showHome);
    row.appendChild(again);
    row.appendChild(other);
    dock.appendChild(row);
    rc.scrollIntoView({ block: "start", behavior: "smooth" });
  }

  homeBtn.addEventListener("click", showHome);
  showHome();
})();
</script>
