<style>
/* Layout: schmale Handy-Spalte. Start = Stationenliste wie ein Laufzettel, Station = Wissenskarten, dann eine Aufgabe pro Bildschirm mit fester Weiter-Leiste unten, Ende = Nachweis zum Abfotografieren */
:root {
  --paper: #f2f4f6;
  --surface: #ffffff;
  --ink: #18202b;
  --muted: #5b6676;
  --line: #d9dee5;
  --accent: #2346a0;
  --accent-ink: #ffffff;
  --accent-soft: #e3e9f8;
  --good: #1d7a4c;
  --good-soft: #def2e7;
  --ok: #9a6400;
  --ok-soft: #fbefd6;
  --bad: #b5352a;
  --bad-soft: #f8e1de;
  --shadow: 0 1px 2px rgba(24, 32, 43, .06), 0 6px 18px rgba(24, 32, 43, .06);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12161c; --surface: #1b212a; --ink: #e8ecf2; --muted: #9aa5b5; --line: #2c3440;
    --accent: #7d9bf0; --accent-ink: #0f1420; --accent-soft: #232d45;
    --good: #5fcf94; --good-soft: #17322a; --ok: #e7b45a; --ok-soft: #352a14; --bad: #f08a7e; --bad-soft: #3a1f1c;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #12161c; --surface: #1b212a; --ink: #e8ecf2; --muted: #9aa5b5; --line: #2c3440;
  --accent: #7d9bf0; --accent-ink: #0f1420; --accent-soft: #232d45;
  --good: #5fcf94; --good-soft: #17322a; --ok: #e7b45a; --ok-soft: #352a14; --bad: #f08a7e; --bad-soft: #3a1f1c;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--f-body); font-size: 1.0625rem; line-height: 1.55;
}
.wrap {
  max-width: 640px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 120px;
  display: flex; flex-direction: column; gap: 16px;
}
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: 2rem; font-weight: 800; letter-spacing: -.01em; }
h2 { font-size: 1.45rem; font-weight: 800; }
h3 { font-size: 1.1rem; font-weight: 600; }
p { margin: 0; }
.kicker { font-family: var(--f-mono); font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
.muted { color: var(--muted); }
.card { background: var(--surface); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.task { background: var(--accent-soft); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.task ol { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 4px; }
label.field { display: flex; flex-direction: column; gap: 6px; font-weight: 700; }
input[type=text] {
  font: inherit; padding: 12px 14px; border-radius: 10px; border: 1.5px solid var(--line);
  background: var(--surface); color: var(--ink); width: 100%;
}
input[type=text]:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Stationen */
.stations { display: flex; flex-direction: column; gap: 10px; }
.station {
  display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center;
  background: var(--surface); border: 0; border-radius: 14px; padding: 14px; box-shadow: var(--shadow);
  font: inherit; color: inherit; text-align: left; cursor: pointer; width: 100%;
}
.station .num {
  width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
  background: var(--accent-soft); color: var(--accent); font-family: var(--f-display); font-weight: 800; font-size: 1.2rem;
}
.station.done .num { background: var(--good-soft); color: var(--good); }
.station .t { font-weight: 700; display: block; line-height: 1.3; }
.station .s { font-size: .9rem; color: var(--muted); display: block; }
.station .score { font-family: var(--f-mono); font-size: .85rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.station.done .score { color: var(--good); font-weight: 600; }

/* Wissen */
.facts { display: flex; flex-direction: column; gap: 12px; }
.fact h3 { color: var(--accent); }
.fact ul { margin: 0; padding-left: 1.15em; display: flex; flex-direction: column; gap: 4px; }
.page { font-family: var(--f-mono); font-size: .78rem; color: var(--muted); }
.term { background: var(--ok-soft); border-radius: 10px; padding: 10px 12px; font-size: .95rem; }
.term b { color: var(--ok); }

/* Aufgabe */
.progress { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
.qhead { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.qtype { font-family: var(--f-mono); font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-variant-numeric: tabular-nums; }
.quote { font-family: var(--f-display); font-size: 1.15rem; font-weight: 600; border-left: 0; background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt {
  font: inherit; color: var(--ink); text-align: left; cursor: pointer;
  background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; min-height: 52px;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.dim { opacity: .55; }
.tf { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tf .opt { text-align: center; font-weight: 700; }

.sort-item { background: var(--surface); border-radius: 12px; padding: 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px; }
.sort-item.right { box-shadow: inset 0 0 0 2px var(--good); }
.sort-item.wrong { box-shadow: inset 0 0 0 2px var(--bad); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font: inherit; font-size: .9rem; cursor: pointer; color: var(--ink);
  border: 1.5px solid var(--line); background: var(--paper); border-radius: 99px; padding: 6px 12px; min-height: 38px;
}
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.chip.should { border-color: var(--good); border-style: dashed; }
.chip:disabled { cursor: default; }
.fix { font-size: .88rem; color: var(--bad); font-weight: 700; }

.feedback { border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.feedback.good { background: var(--good-soft); }
.feedback.bad { background: var(--bad-soft); }
.feedback.mid { background: var(--ok-soft); }
.feedback strong { font-family: var(--f-display); font-size: 1.1rem; }
.feedback.good strong { color: var(--good); }
.feedback.bad strong { color: var(--bad); }
.feedback.mid strong { color: var(--ok); }

/* Leiste unten */
.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-top: 12px;
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.bar-in { max-width: 640px; margin: 0 auto; display: flex; gap: 10px; }
.btn {
  font: inherit; font-weight: 700; cursor: pointer; border-radius: 12px; padding: 13px 18px; min-height: 50px;
  border: 2px solid var(--accent); background: var(--accent); color: var(--accent-ink); flex: 1;
}
.btn.ghost { background: transparent; color: var(--accent); flex: 0 0 auto; }
.btn:disabled { opacity: .45; cursor: default; }

/* Ergebnis */
.big { font-family: var(--f-display); font-weight: 800; font-size: 3rem; line-height: 1; font-variant-numeric: tabular-nums; }
.rows { display: flex; flex-direction: column; }
.row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px dashed var(--line); font-variant-numeric: tabular-nums; }
.row:last-child { border-bottom: 0; }
.row span:last-child { font-family: var(--f-mono); white-space: nowrap; }
.row.text span:last-child { font-family: var(--f-body); font-weight: 700; white-space: normal; text-align: right; min-width: 0; overflow-wrap: anywhere; }
.cert { border: 2px solid var(--accent); }
.review ul { margin: 0; padding-left: 1.15em; display: flex; flex-direction: column; gap: 6px; }
.note { font-size: .9rem; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .progress i { transition: none; } }
</style>

  // ---------------- Speicher ----------------
  function load() { try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) { return {}; } }
  function save() { try { localStorage.setItem(STORE, JSON.stringify(state.saved)); } catch (e) {} }

  const state = { saved: load(), view: "home", st: 0, qi: 0, score: 0, answered: false, sel: [], order: [], wrong: [], name: "" };
  state.name = state.saved.name || "";
  state.saved.best = state.saved.best || {};

  const app = document.getElementById("app");
  const bar = document.getElementById("bar");
  const barIn = document.getElementById("barIn");

  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
  function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function maxPts(q) { return q.t === "sort" ? q.items.length : 1; }
  function stationMax(s) { return s.qs.reduce((n, q) => n + maxPts(q), 0); }
  function setBar(buttons) {
    barIn.innerHTML = "";
    if (!buttons.length) { bar.hidden = true; return; }
    bar.hidden = false;
    buttons.forEach(b => {
      const el = document.createElement("button");
      el.className = "btn" + (b.ghost ? " ghost" : "");
      el.type = "button"; el.textContent = b.label; el.id = b.id;
      if (b.disabled) el.disabled = true;
      el.addEventListener("click", b.on);
      barIn.appendChild(el);
    });
  }
  function top() { window.scrollTo(0, 0); }
  function grade(pct) {
    if (pct >= 92) return "sehr gut (1)";
    if (pct >= 81) return "gut (2)";
    if (pct >= 67) return "befriedigend (3)";
    if (pct >= 50) return "ausreichend (4)";
    if (pct >= 30) return "mangelhaft (5)";
    return "ungenügend (6)";
  }

  // ---------------- Startseite ----------------
  function home() {
    state.view = "home";
    const done = STATIONS.filter((s, i) => state.saved.best[i] != null).length;
    app.innerHTML = `
      <div class="kicker">Lernfeld 10 · 2. Ausbildungsjahr</div>
      <h1>Kundenvielfalt</h1>
      <p class="muted">Kundengruppen und Kundentypen im Einzelhandel. Buch „Ausbildung im Einzelhandel“, S. 168–177.</p>
      <div class="task">
        <h3>Ihr Arbeitsauftrag</h3>
        <ol>
          <li>Lesen Sie die Seiten der jeweiligen Station im Buch.</li>
          <li>Lesen Sie in der App „Das Wichtigste“ und bearbeiten Sie danach die Aufgaben.</li>
          <li>Bearbeiten Sie alle fünf Stationen. Sie können jede Station wiederholen. Es zählt Ihr bestes Ergebnis.</li>
          <li>Machen Sie am Ende einen Screenshot von Ihrem Nachweis und bewahren Sie ihn für Ihre Lehrkraft auf.</li>
        </ol>
      </div>
      <label class="field" for="name">Ihr Name (für den Nachweis)
        <input type="text" id="name" autocomplete="name" placeholder="Vorname Nachname" value="${esc(state.name)}">
      </label>
      <div class="stations">
        ${STATIONS.map((s, i) => {
          const b = state.saved.best[i];
          return `<button class="station${b != null ? " done" : ""}" data-st="${i}" type="button">
            <span class="num">${b != null ? "✓" : i + 1}</span>
            <span><span class="t">${esc(s.title)}</span><span class="s">${s.pages} · ${s.qs.length} Aufgaben</span></span>
            <span class="score">${b != null ? b + "/" + stationMax(s) : "offen"}</span>
          </button>`;
        }).join("")}
      </div>
      <p class="note">${done} von ${STATIONS.length} Stationen erledigt. Ihre Ergebnisse werden nur auf diesem Gerät gespeichert.</p>`;
    const nameEl = document.getElementById("name");
    nameEl.addEventListener("input", () => { state.name = nameEl.value; state.saved.name = nameEl.value; save(); });
    app.querySelectorAll(".station").forEach(b => b.addEventListener("click", () => intro(+b.dataset.st)));
    setBar([{ id: "toCert", label: "Zum Nachweis", disabled: done === 0, on: certificate }]);
    top();
  }

  // ---------------- Wissen ----------------
  function intro(i) {
    state.view = "intro"; state.st = i;
    const s = STATIONS[i];
    app.innerHTML = `
      <div class="kicker">Station ${i + 1} von ${STATIONS.length} · ${s.pages}</div>
      <h2>${esc(s.title)}</h2>
      <p class="muted">Das Wichtigste in Kürze. Lesen Sie zuerst die Seiten im Buch, dann diese Zusammenfassung.</p>
      <div class="facts">
        ${s.facts.map(f => `<div class="card fact">
          <h3>${esc(f.h)}</h3>
          <ul>${f.list.map(l => `<li>${esc(l)}</li>`).join("")}</ul>
          ${f.term ? `<div class="term"><b>${esc(f.term[0])}:</b> ${esc(f.term[1])}</div>` : ""}
          <div class="page">${f.p}</div>
        </div>`).join("")}
      </div>`;
    setBar([{ id: "back", label: "Zurück", ghost: true, on: home }, { id: "start", label: `Aufgaben starten (${s.qs.length})`, on: () => startQuiz(i) }]);
    top();
  }

  // ---------------- Aufgaben ----------------
  function startQuiz(i) {
    state.st = i; state.qi = 0; state.score = 0; state.wrong = [];
    question();
  }
  function question() {
    state.view = "q"; state.answered = false; state.sel = [];
    const s = STATIONS[state.st], q = s.qs[state.qi];
    const pct = (state.qi / s.qs.length) * 100;
    let body = "";
    if (q.t === "mc") {
      state.order = shuffle(q.o.map((_, k) => k));
      body = `<div class="opts">${state.order.map(k => `<button class="opt" type="button" data-k="${k}">${esc(q.o[k])}</button>`).join("")}</div>`;
    } else if (q.t === "tf") {
      body = `<div class="tf"><button class="opt" type="button" data-v="1">Richtig</button><button class="opt" type="button" data-v="0">Falsch</button></div>`;
    } else {
      state.order = shuffle(q.items.map((_, k) => k));
      state.sel = q.items.map(() => -1);
      body = `<div class="opts">${state.order.map(k => `<div class="sort-item" data-k="${k}">
          <div>${esc(q.items[k][0])}</div>
          <div class="chips">${q.cats.map((c, ci) => `<button class="chip" type="button" data-c="${ci}">${esc(c)}</button>`).join("")}</div>
        </div>`).join("")}</div>`;
    }
    const label = q.t === "mc" ? "Eine Antwort ist richtig" : q.t === "tf" ? "Richtig oder falsch?" : "Zuordnen";
    app.innerHTML = `
      <div class="qhead"><span class="kicker">Station ${state.st + 1} · ${esc(s.title)}</span></div>
      <div class="progress" aria-hidden="true"><i style="width:${pct}%"></i></div>
      <div class="qhead"><span class="qtype">Aufgabe ${state.qi + 1}/${s.qs.length}</span><span class="qtype">${label}</span></div>
      <h2>${esc(q.q)}</h2>
      ${q.quote ? `<div class="quote">${esc(q.quote)}</div>` : ""}
      ${body}
      <div id="fb"></div>`;
    if (q.t === "mc") app.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => answerMc(+b.dataset.k)));
    if (q.t === "tf") app.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => answerTf(b.dataset.v === "1")));
    if (q.t === "sort") {
      app.querySelectorAll(".sort-item").forEach(it => {
        const k = +it.dataset.k;
        it.querySelectorAll(".chip").forEach(ch => ch.addEventListener("click", () => {
          if (state.answered) return;
          state.sel[k] = +ch.dataset.c;
          it.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c === ch));
          document.getElementById("check").disabled = state.sel.some(v => v < 0);
        }));
      });
      setBar([{ id: "quit", label: "Abbrechen", ghost: true, on: () => intro(state.st) }, { id: "check", label: "Prüfen", disabled: true, on: answerSort }]);
    } else {
      setBar([{ id: "quit", label: "Abbrechen", ghost: true, on: () => intro(state.st) }]);
    }
    top();
  }
  function feedback(got, max, q) {
    state.score += got;
    if (got < max) state.wrong.push(q);
    const cls = got === max ? "good" : got > 0 ? "mid" : "bad";
    const head = got === max ? "Richtig!" : got > 0 ? `Teilweise richtig: ${got} von ${max}` : "Leider falsch.";
    const fb = document.getElementById("fb");
    fb.className = "feedback " + cls;
    fb.innerHTML = `<strong>${head}</strong><p>${esc(q.ex)}</p><div class="page">Nachlesen: ${q.p}</div>`;
    state.answered = true;
    const last = state.qi === STATIONS[state.st].qs.length - 1;
    setBar([{ id: "next", label: last ? "Ergebnis ansehen" : "Weiter", on: next }]);
    fb.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "nearest" });
  }
  function answerMc(k) {
    if (state.answered) return;
    const q = STATIONS[state.st].qs[state.qi];
    app.querySelectorAll(".opt").forEach(b => {
      const bk = +b.dataset.k; b.disabled = true;
      if (bk === q.a) b.classList.add("right");
      else if (bk === k) b.classList.add("wrong");
      else b.classList.add("dim");
    });
    feedback(k === q.a ? 1 : 0, 1, q);
  }
  function answerTf(v) {
    if (state.answered) return;
    const q = STATIONS[state.st].qs[state.qi];
    app.querySelectorAll(".opt").forEach(b => {
      const bv = b.dataset.v === "1"; b.disabled = true;
      if (bv === q.a) b.classList.add("right");
      else if (bv === v) b.classList.add("wrong");
    });
    feedback(v === q.a ? 1 : 0, 1, q);
  }
  function answerSort() {
    if (state.answered) return;
    const q = STATIONS[state.st].qs[state.qi];
    let got = 0;
    app.querySelectorAll(".sort-item").forEach(it => {
      const k = +it.dataset.k, should = q.items[k][1], ok = state.sel[k] === should;
      if (ok) got++;
      it.classList.add(ok ? "right" : "wrong");
      it.querySelectorAll(".chip").forEach(c => { c.disabled = true; if (!ok && +c.dataset.c === should) c.classList.add("should"); });
      if (!ok) it.insertAdjacentHTML("beforeend", `<div class="fix">Richtig wäre: ${esc(q.cats[should])}</div>`);
    });
    feedback(got, q.items.length, q);
  }
  function next() {
    const s = STATIONS[state.st];
    if (state.qi < s.qs.length - 1) { state.qi++; question(); } else result();
  }

  // ---------------- Ergebnis einer Station ----------------
  function result() {
    state.view = "result";
    const i = state.st, s = STATIONS[i], max = stationMax(s);
    const prev = state.saved.best[i];
    if (prev == null || state.score > prev) state.saved.best[i] = state.score;
    save();
    const pct = Math.round(state.score / max * 100);
    const pages = [...new Set(state.wrong.map(q => q.p))];
    const nextSt = STATIONS.findIndex((_, k) => state.saved.best[k] == null);
    app.innerHTML = `
      <div class="kicker">Station ${i + 1} abgeschlossen</div>
      <h2>${esc(s.title)}</h2>
      <div class="card">
        <div class="big">${state.score}<span class="muted" style="font-size:1.4rem"> / ${max} Punkte</span></div>
        <p>${pct} % · ${grade(pct)}${prev != null && state.score <= prev ? ` · Ihr Bestwert bleibt ${prev} Punkte.` : ""}</p>
      </div>
      ${state.wrong.length ? `<div class="card review">
        <h3>Das sollten Sie noch einmal nachlesen</h3>
        <ul>${state.wrong.map(q => `<li>${esc(q.q)} <span class="page">(${q.p})</span></li>`).join("")}</ul>
      </div>` : `<div class="feedback good"><strong>Alles richtig!</strong><p>Sie beherrschen die Inhalte dieser Station.</p></div>`}
      ${pages.length ? `<p class="note">Lesen Sie die genannten Stellen nach und wiederholen Sie die Station, wenn Sie Ihr Ergebnis verbessern möchten.</p>` : ""}`;
    const btns = [{ id: "again", label: "Wiederholen", ghost: true, on: () => startQuiz(i) }];
    if (nextSt >= 0) btns.push({ id: "nextSt", label: `Weiter mit Station ${nextSt + 1}`, on: () => intro(nextSt) });
    else btns.push({ id: "cert", label: "Zum Nachweis", on: certificate });
    setBar(btns);
    top();
  }

  // ---------------- Nachweis ----------------
  function certificate() {
    state.view = "cert";
    let got = 0, max = 0, done = 0;
    STATIONS.forEach((s, i) => { max += stationMax(s); if (state.saved.best[i] != null) { got += state.saved.best[i]; done++; } });
    const pct = Math.round(got / max * 100);
    const date = new Date().toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
    app.innerHTML = `
      <div class="kicker">Nachweis · Lernfeld 10</div>
      <h2>Kundenvielfalt: Kundengruppen und Kundentypen</h2>
      <div class="card cert">
        <div class="rows">
          <div class="row text"><span>Name</span><span>${state.name.trim() ? esc(state.name.trim()) : "<i>bitte auf der Startseite eintragen</i>"}</span></div>
          <div class="row text"><span>Datum</span><span>${esc(date)}</span></div>
          ${STATIONS.map((s, i) => `<div class="row"><span>${i + 1}. ${esc(s.title)}</span><span>${state.saved.best[i] != null ? state.saved.best[i] + "/" + stationMax(s) : "offen"}</span></div>`).join("")}
        </div>
        <div class="big">${pct} %</div>
        <p><b>${got} von ${max} Punkten</b> · ${grade(pct)}</p>
        ${done < STATIONS.length ? `<p class="fix">Noch offen: ${STATIONS.length - done} Station(en). Offene Stationen zählen mit 0 Punkten.</p>` : ""}
      </div>
      <p class="note">Machen Sie jetzt einen Screenshot von dieser Seite und bewahren Sie ihn für Ihre Lehrkraft auf.</p>`;
    setBar([{ id: "home", label: "Zur Startseite", on: home }]);
    top();
  }

  home();
})();
</script>

</body>
</html>
