<title>Kalkulationstrainer Einzelhandel</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: Startseite mit Stufen als Preisetiketten (2 Spalten, mobil 1), Übung als Kalkulationsblatt mit Summenstrichen, Auswertung als Blatt mit Korrekturen */
:root {
  --paper: #eff3f3;
  --surface: #ffffff;
  --ink: #15211f;
  --muted: #566664;
  --line: #d3dcdb;
  --accent: #0d5f69;
  --accent-ink: #ffffff;
  --accent-soft: #dcecee;
  --tag: #f4cf55;
  --tag-ink: #2b2410;
  --good: #1d7a4c;
  --good-soft: #def2e7;
  --ok: #8f5d00;
  --ok-soft: #fbefd6;
  --bad: #b5352a;
  --bad-soft: #f8e1de;
  --shadow: 0 1px 2px rgba(21, 33, 31, .06), 0 6px 18px rgba(21, 33, 31, .07);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111817; --surface: #1a2321; --ink: #e6eeec; --muted: #9bacaa; --line: #2c3a38;
    --accent: #6cc3cc; --accent-ink: #0b1615; --accent-soft: #1d3436; --tag: #d9b440; --tag-ink: #1d1806;
    --good: #5fcf94; --good-soft: #17322a; --ok: #e7b45a; --ok-soft: #352a14; --bad: #f08a7e; --bad-soft: #3a1f1c;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111817; --surface: #1a2321; --ink: #e6eeec; --muted: #9bacaa; --line: #2c3a38;
  --accent: #6cc3cc; --accent-ink: #0b1615; --accent-soft: #1d3436; --tag: #d9b440; --tag-ink: #1d1806;
  --good: #5fcf94; --good-soft: #17322a; --ok: #e7b45a; --ok-soft: #352a14; --bad: #f08a7e; --bad-soft: #3a1f1c;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 1.0625rem;
  line-height: 1.55;
}
.wrap {
  max-width: 980px;
  margin: 0 auto;
  padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(2rem, 6vw, 3.1rem); font-weight: 800; letter-spacing: -.02em; }
h2 { font-size: 1.45rem; font-weight: 700; }
h3 { font-size: 1.12rem; font-weight: 700; }
p { margin: 0; }
.eyebrow { font-size: .78rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.muted { color: var(--muted); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .4rem;
  border: 1.5px solid var(--accent); background: var(--accent); color: var(--accent-ink);
  border-radius: 10px; padding: .62rem 1.1rem; font-weight: 700; cursor: pointer;
  min-height: 44px; text-decoration: none;
}
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.ghost:hover { background: var(--accent-soft); filter: none; }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.linkbtn { background: none; border: 0; padding: .3rem 0; color: var(--accent); font-weight: 700; cursor: pointer; }

/* ---------- Startseite ---------- */
.hero { display: grid; gap: 14px; max-width: 46rem; }
.hero p.lead { font-size: 1.15rem; color: var(--muted); max-width: 60ch; }
.setup { display: flex; flex-wrap: wrap; gap: 18px 28px; margin-top: 26px; align-items: flex-end; }
.setup .grp { display: grid; gap: 6px; min-width: 0; }
.setup label, .setup .lab { font-size: .85rem; font-weight: 700; color: var(--muted); }
.setup input[type=text] {
  border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px;
  padding: .55rem .8rem; min-height: 44px; width: min(260px, 100%);
}
.seg { display: inline-flex; flex-wrap: wrap; border: 1.5px solid var(--line); border-radius: 12px; padding: 3px; background: var(--surface); gap: 3px; }
.seg button { border: 0; background: transparent; border-radius: 9px; padding: .45rem .9rem; cursor: pointer; font-weight: 700; color: var(--muted); min-height: 40px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.levels { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; margin-top: 30px; }
@media (max-width: 720px) { .levels { grid-template-columns: 1fr; } }
.tag {
  position: relative; background: var(--surface); border-radius: 6px 18px 18px 6px;
  box-shadow: var(--shadow); border: 1px solid var(--line);
  padding: 20px 20px 20px 46px; display: grid; gap: 10px; min-width: 0;
}
.tag::before {
  content: ""; position: absolute; left: 16px; top: 24px; width: 13px; height: 13px; border-radius: 50%;
  background: var(--paper); border: 1.5px solid var(--line);
}
.tag::after {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; border-radius: 6px 0 0 6px; background: var(--tag);
}
.tag .head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.tag .lvl { font-family: var(--f-mono); font-weight: 600; font-size: .85rem; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.tag ul { margin: 0; padding-left: 1.1rem; color: var(--muted); font-size: .97rem; }
.tag .foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 4px; }
.tag.locked { opacity: .7; }
.tag.locked::after { background: var(--line); }
.chip { display: inline-flex; align-items: center; gap: .3rem; font-size: .82rem; font-weight: 700; border-radius: 999px; padding: .18rem .6rem; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }

.info { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; margin-top: 40px; }
@media (max-width: 720px) { .info { grid-template-columns: 1fr; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.panel ul { margin: 0; padding-left: 1.1rem; display: grid; gap: 6px; }
.schema { display: grid; gap: 0; font-size: .95rem; }
.schema .sr { display: grid; grid-template-columns: 1.4rem 1fr auto; gap: 8px; padding: 4px 0; align-items: baseline; }
.schema .sr.sum { border-top: 1.5px solid var(--ink); font-weight: 700; }
.schema .sr .o { font-family: var(--f-mono); color: var(--muted); }
.schema .sr .v { font-family: var(--f-mono); font-variant-numeric: tabular-nums; text-align: right; }
.schema .sr small { color: var(--muted); font-weight: 400; }
.teacher { margin-top: 28px; font-size: .9rem; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }

/* ---------- Übung ---------- */
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.dots { display: flex; gap: 6px; }
.dots span { width: 28px; height: 6px; border-radius: 3px; background: var(--line); }
.dots span.on { background: var(--accent); }
.dots span.done { background: var(--tag); }
.work { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 22px; align-items: start; }
@media (max-width: 820px) { .work { grid-template-columns: 1fr; } }
.offer { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 14px; }
.offer .who { font-size: .85rem; color: var(--muted); font-weight: 700; }
.facts { margin: 0; display: grid; gap: 0; }
.facts div { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px dashed var(--line); }
.facts div:last-child { border-bottom: 0; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.goal { background: var(--accent-soft); color: var(--ink); border-radius: 10px; padding: 10px 12px; font-weight: 700; }

.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px 18px; box-shadow: var(--shadow); }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding-bottom: 8px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.row { display: grid; grid-template-columns: 1.6rem minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 7px 0; }
.row .op { font-family: var(--f-mono); font-weight: 600; font-size: 1.1rem; color: var(--muted); text-align: center; }
.row .lbl { min-width: 0; hyphens: auto; overflow-wrap: anywhere; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.row.sum { border-top: 1.5px solid var(--ink); }
.row.sum .lbl { font-weight: 700; }
.row.final { border-bottom: 4px double var(--ink); }
.row.given .val { font-family: var(--f-mono); font-weight: 600; padding-right: 1.6rem; }
.field { display: inline-flex; align-items: center; gap: 6px; }
.field input {
  width: 8.6rem; text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums;
  border: 1.5px solid var(--line); border-radius: 8px; padding: .45rem .6rem; background: var(--paper); min-height: 42px;
}
.field input:focus { border-color: var(--accent); background: var(--surface); }
.field .unit { color: var(--muted); width: 1rem; }
.row select { border: 1.5px solid var(--line); border-radius: 8px; padding: .3rem .5rem; background: var(--paper); min-height: 38px; }
.help { grid-column: 2 / -1; font-size: .85rem; color: var(--accent); font-family: var(--f-mono); margin-top: -2px; }
.sheet:not(.show-help) .help { display: none; }
.nav { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 18px; }
.warn { margin-top: 14px; border: 1.5px solid var(--ok); background: var(--ok-soft); border-radius: 12px; padding: 12px 14px; display: grid; gap: 10px; }
.warn .acts { display: flex; gap: 10px; flex-wrap: wrap; }
.warn.stop { border-color: var(--bad); background: var(--bad-soft); }
.field input.missing, .row select.missing { border-color: var(--bad); background: var(--bad-soft); }
.btn.is-off { opacity: .5; }
.binfo { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 14px; margin-top: 18px; }
.binfo > div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 6px; min-width: 0; }
.binfo p { font-size: .93rem; }
.pick-hint { margin-top: 18px; border: 1.5px dashed var(--accent); border-radius: 12px; padding: 12px 14px; color: var(--accent); font-weight: 700; }
@media (max-width: 420px) { .field input { width: 6.6rem; } .row { gap: 4px 6px; } }

/* ---------- Auswertung ---------- */
.score { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px 26px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px; box-shadow: var(--shadow); }
@media (max-width: 620px) { .score { grid-template-columns: 1fr; } }
.score .big { font-family: var(--f-display); font-weight: 800; font-size: 3.4rem; line-height: 1; font-variant-numeric: tabular-nums; }
.meter { position: relative; height: 14px; background: var(--paper); border-radius: 7px; border: 1px solid var(--line); margin-top: 8px; }
.meter i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 7px; background: var(--bad); }
.meter i.pass { background: var(--good); }
.meter b { position: absolute; top: -6px; bottom: -6px; width: 2px; background: var(--ink); }
.meter-l { display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted); margin-top: 4px; }
.verdict { border-radius: 12px; padding: 12px 14px; font-weight: 700; }
.verdict.pass { background: var(--good-soft); color: var(--good); }
.verdict.fail { background: var(--bad-soft); color: var(--bad); }
.section { margin-top: 30px; display: grid; gap: 14px; }
.practice { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 720px) { .practice { grid-template-columns: 1fr; } }
.practice .panel h3 { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.ex { font-family: var(--f-mono); font-size: .88rem; background: var(--paper); border-radius: 8px; padding: 8px 10px; }

details.res { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
details.res > summary { list-style: none; cursor: pointer; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
details.res > summary::-webkit-details-marker { display: none; }
details.res > summary::before { content: "▸"; color: var(--muted); margin-right: 4px; }
details.res[open] > summary::before { content: "▾"; }
details.res > summary .t { flex: 1; font-weight: 700; min-width: 12rem; }
.res-body { padding: 0 18px 16px; display: grid; gap: 12px; }
.rt { display: grid; gap: 0; }
.rr { display: grid; grid-template-columns: 1.4rem minmax(0, 1fr) 7.6rem 7.6rem 7.4rem; gap: 2px 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); }
.rr.head { font-size: .78rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.rr.sum .l { font-weight: 700; }
.rr .o { font-family: var(--f-mono); color: var(--muted); text-align: center; }
.rr .y, .rr .c { font-family: var(--f-mono); font-variant-numeric: tabular-nums; text-align: right; }
.rr .y.wrong { color: var(--bad); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.rr .y.empty { color: var(--bad); }
.rr .s { text-align: right; }
.rr .hint { grid-column: 2 / -1; font-size: .92rem; border-radius: 8px; padding: 7px 10px; margin-top: 4px; background: var(--bad-soft); }
.rr .hint.folge { background: var(--ok-soft); }
.rr .hint b { display: block; font-size: .78rem; letter-spacing: .04em; text-transform: uppercase; }
@media (max-width: 620px) {
  .rr { grid-template-columns: 1.4rem minmax(0, 1fr) auto; }
  .rr.head { display: none; }
  .rr .l { grid-column: 2 / 3; }
  .rr .s { grid-column: 3 / 4; grid-row: 1; }
  .rr .y, .rr .c { grid-column: 2 / -1; text-align: left; font-size: .9rem; }
  .rr .y::before { content: "Ihre Eingabe: "; font-family: var(--f-body); color: var(--muted); }
  .rr .c::before { content: "Richtig: "; font-family: var(--f-body); color: var(--muted); }
}
.actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 26px; }

@media (prefers-reduced-motion: no-preference) {
  .screen { animation: rise .28s ease-out; }
  @keyframes rise { from { transform: translateY(6px); opacity: .6; } to { transform: none; opacity: 1; } }
}
</style>

<script>

  const pct = (cents, rate) => Math.round(cents * rate / 100 + 1e-7);
  const near = (x, y, t = TOL) => Math.abs(x - y) <= t;

    if (raw == null) return null;
    let s = String(raw).replace(/€|\s/g, "");
    if (!s) return null;
    if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");

        { name: "Strickpullover aus Merinowolle", per: "je Stück", many: "Stück", tax: 19, lep: [3500, 5500] },
        { name: "Winterjacken „Nordkap“", per: "je Stück", many: "Stück", tax: 19, lep: [7000, 12000] },
        { name: "Sneaker aus Leder", per: "je Paar", many: "Paar", tax: 19, lep: [4000, 6500] },
        { name: "Basic-T-Shirts", per: "je Stück", many: "Stück", tax: 19, lep: [600, 1200] },
        { name: "Business-Hemden", per: "je Stück", many: "Stück", tax: 19, lep: [1800, 3000] },
        { name: "Sommerkleider", per: "je Stück", many: "Stück", tax: 19, lep: [2500, 4000] },
        { name: "Regenjacken", per: "je Stück", many: "Stück", tax: 19, lep: [4500, 7000] },
        { name: "Wollschals", per: "je Stück", many: "Stück", tax: 19, lep: [1000, 1800] }
      ]
    }
  };

  const CATS = {
    leer: { t: "Alle Felder ausfüllen", d: "Leere Felder zählen als Fehler. Rechnen Sie jede Zeile, auch wenn Sie unsicher sind. Rechnen Sie mit einem falschen Wert richtig weiter, gilt das als Folgefehler und kostet keinen weiteren Punkt.", ex: "Lieber eine Zahl eintragen als gar nichts." },
    prozent: { t: "Prozentwert berechnen", d: "Prozentwert = Grundwert × Prozentsatz ÷ 100. Achten Sie darauf, wo das Komma steht, und tragen Sie den Betrag in Euro ein, nicht den Prozentsatz.", ex: "15 % von 40,00 € = 40,00 × 15 ÷ 100 = 6,00 €" },
    basis: { t: "Die richtige Bezugsgröße", d: "Jeder Prozentsatz bezieht sich auf das Zwischenergebnis direkt darüber: Rabatt auf den Listeneinkaufspreis, Skonto auf den Zieleinkaufspreis, Handlungskosten auf den Bezugspreis, Gewinn auf den Selbstkostenpreis, Umsatzsteuer auf den Nettoverkaufspreis.", ex: "Skonto 2 % vom Zieleinkaufspreis, nicht vom Listeneinkaufspreis" },
    vorzeichen: { t: "Plus oder minus?", d: "Im Einkauf wird die Ware billiger: Rabatt und Skonto ziehen Sie ab. Danach wird sie teurer: Bezugskosten, Handlungskosten, Gewinn und Umsatzsteuer rechnen Sie dazu.", ex: "− Rabatt  − Skonto  + Bezugskosten  + Handlungskosten  + Gewinn  + USt" },
    imHundert: { t: "Vom Hundert rechnen", d: "In der Vorwärtskalkulation ist der Wert darüber immer 100 %. Rechnen Sie also Grundwert × p ÷ 100 und nicht ÷ (100 + p). Das Rechnen im Hundert brauchen Sie erst bei der Rückwärtskalkulation.", ex: "USt 19 % von 50,00 € = 50,00 × 19 ÷ 100 = 9,50 €" },
    ust: { t: "Umsatzsteuersätze", d: "Lebensmittel haben den ermäßigten Satz von 7 %. Getränke wie Mineralwasser, Saft oder Wein haben 19 % (Ausnahme: Milch). Bekleidung und Schuhe haben immer 19 %.", ex: "Käse 7 %  ·  Orangensaft 19 %  ·  Jeans 19 %" },
    runden: { t: "Auf Cent runden", d: "Rechnen Sie genau und runden Sie jedes Ergebnis auf zwei Nachkommastellen. Ist die dritte Stelle 5 oder größer, wird aufgerundet.", ex: "12,345 € → 12,35 €   ·   12,344 € → 12,34 €" },
    rechnen: { t: "Zwischenergebnisse genau rechnen", d: "Kontrollieren Sie Addition und Subtraktion. Machen Sie vorher einen Überschlag: Passt das Ergebnis ungefähr?", ex: "34,12 + 15,35 = 49,47  (Überschlag: 34 + 15 = 49)" },
    zeile: { t: "Betrag und Zwischenergebnis trennen", d: "Jede Rechenstufe hat zwei Zeilen: erst den Euro-Betrag (zum Beispiel den Rabatt), dann nach dem Summenstrich das neue Zwischenergebnis (zum Beispiel den Zieleinkaufspreis).", ex: "− Rabatt 6,00 €  /  = Zieleinkaufspreis 34,00 €" },
    bezugskosten: { t: "Bezugskosten pro Stück", d: "Gelten Fracht oder Verpackung für die ganze Lieferung, teilen Sie sie durch die Bestellmenge. Erst dann kommen sie in die Kalkulation je Stück.", ex: "36,00 € ÷ 48 Stück = 0,75 € je Stück" }
  };

  /* ================= Aufgaben erzeugen ================= */
  function chainLabels(t) {
    return [BASE_NAME[t.start]].concat(t.steps.map(s => STEP[s.key].result));
  }

  function solve(t) {
    let v = t.startValue;
    const vals = [v], amts = [];
    t.steps.forEach(s => {
      const D = STEP[s.key];
      const a = D.type === "fixed" ? s.amount : pct(v, s.rate);
      v += D.op * a;
      amts.push(a); vals.push(v);
    });
    return { vals, amts };
  }

  function choosePairs(level, branch) {
    const L = LEVELS[level - 1];
    const lm = shuffle(BRANCHES.lm.products).map(p => ["lm", p]);
    const bk = shuffle(BRANCHES.bk.products).map(p => ["bk", p]);
    let pool;
    if (branch === "lm") pool = lm;
    else if (branch === "bk") pool = bk;
    else { pool = []; const first = Math.random() < .5 ? [lm, bk] : [bk, lm]; for (let i = 0; i < 9; i++) { pool.push(first[0][i], first[1][i]); } }
    let pairs = pool.slice(0, L.tasks);
    // Profi-Stufe: bei Lebensmitteln beide Steuersätze vorkommen lassen
    if (L.ustSelect) {
      const lmPairs = pairs.filter(p => p[0] === "lm");
      if (lmPairs.length >= 2 && lmPairs.every(p => p[1].tax === lmPairs[0][1].tax)) {
        const other = lm.find(p => p[1].tax !== lmPairs[0][1].tax);
        pairs[pairs.indexOf(lmPairs[lmPairs.length - 1])] = other;
      }
    }
    return pairs;
  }

  function makeTask(level, bKey, p) {
    const L = LEVELS[level - 1];
    const B = BRANCHES[bKey];
    const t = { level, branch: bKey, product: p, start: L.start, steps: [], ustSelect: !!L.ustSelect };
    if (L.start === "bzp") {
      t.startValue = randInt(Math.round(p.lep[0] * .8 / 50), Math.round(p.lep[1] * .8 / 50)) * 50;
    } else if (level === 2) {
      t.startValue = randInt(p.lep[0] / 10, p.lep[1] / 10) * 10;
    } else {
      t.startValue = randInt(p.lep[0], p.lep[1]);
    }
    L.steps.forEach(key => {
      const s = { key };
      if (key === "rabatt") s.rate = pick(B.rabatt);
      if (key === "skonto") s.rate = pick(B.skonto);
      if (key === "hk") s.rate = pick(B.hk);
      if (key === "gewinn") s.rate = pick(B.gewinn);
      if (key === "ust") s.rate = p.tax;
      if (key === "bezug") {
        const step = L.bkTotal ? 5 : 10;
        s.amount = randInt(Math.ceil(B.bk[0] / step), Math.floor(B.bk[1] / step)) * step;
        if (L.bkTotal) { s.qty = pick(B.qty); s.total = s.amount * s.qty; }
      }
      t.steps.push(s);
    });
    t.sol = solve(t);
    return t;
  }

  function makeRound(level, branch) {
    return choosePairs(level, branch).map(([b, p]) => makeTask(level, b, p));
  }

  function taskIntro(t) {
    const B = BRANCHES[t.branch], p = t.product, L = LEVELS[t.level - 1];
    if (t.level === 1) return `${B.art} ${B.company} nimmt ${p.name} neu ins Sortiment.`;
    const bz = t.steps.find(s => s.key === "bezug");
    if (L.bkTotal) return `${B.art} ${B.company} bestellt ${bz.qty} ${p.many} ${p.name}.`;
    return `${B.art} ${B.company} bestellt ${p.name}.`;
  }
  function taskGoal(t) {
    const p = t.product;
    if (t.level === 2) return `Berechnen Sie den Bezugspreis ${p.per}.`;
    return `Berechnen Sie den Bruttoverkaufspreis ${p.per}.`;
  }
  function taskFacts(t) {
    const f = [[BASE_NAME[t.start] + " " + t.product.per, fmt(t.startValue)]];
    t.steps.forEach(s => {
      if (s.key === "rabatt") f.push(["Liefererrabatt", s.rate + " %"]);
      if (s.key === "skonto") f.push(["Liefererskonto", s.rate + " % bei Zahlung in 10 Tagen"]);
      if (s.key === "bezug") {
        if (s.total) { f.push(["Bestellmenge", s.qty + " " + t.product.many]); f.push(["Fracht und Verpackung", fmt(s.total) + " für die ganze Lieferung"]); }
        else f.push(["Fracht", fmt(s.amount) + " " + t.product.per]);
      }
      if (s.key === "hk") f.push(["Handlungskostenzuschlag", s.rate + " %"]);
      if (s.key === "gewinn") f.push(["Gewinnzuschlag", s.rate + " %"]);
      if (s.key === "ust") f.push(["Umsatzsteuer", t.ustSelect ? "selbst bestimmen" : s.rate + " %"]);
    });
    return f;
  }

  /* ================= Auswertung ================= */
  function diagAmount(a, c) {
    const { s, D, A, R, B, rate, t, labels, i } = c;
    if (near(a, R) && !near(A, R)) return { cat: "zeile", hint: `Hier gehört nur der Betrag hin. ${fmt(R)} ist schon das Zwischenergebnis (${short(D.result)}).` };
    if (D.type === "fixed") {
      if (s.total && near(a, s.total)) return { cat: "bezugskosten", hint: `Sie haben die Kosten der ganzen Lieferung eingesetzt. Je Einheit: ${fmt(s.total)} ÷ ${s.qty} = ${fmt(A)}.` };
      if (s.total) return { cat: "bezugskosten", hint: `Bezugskosten je Einheit: ${fmt(s.total)} ÷ ${s.qty} = ${fmt(A)}.` };
      return { cat: "bezugskosten", hint: `Die Bezugskosten stehen in der Aufgabe: ${fmt(A)} ${t.product.per}.` };
    }
    if (a === rate * 100) return { cat: "prozent", hint: `Sie haben den Prozentsatz eingetragen. Gesucht ist der Betrag in Euro: ${fmt(B)} × ${rate} ÷ 100 = ${fmt(A)}.` };
    if (D.op > 0 && near(a, Math.round(B * rate / (100 + rate)))) return { cat: "imHundert", hint: `Sie haben im Hundert gerechnet (÷ ${100 + rate}). Vorwärts gilt: ${short(labels[i])} = 100 %, also ${fmt(B)} × ${rate} ÷ 100 = ${fmt(A)}.` };
    if (D.op < 0 && near(a, Math.round(B * rate / (100 - rate)))) return { cat: "imHundert", hint: `Sie haben auf Hundert gerechnet (÷ ${100 - rate}). Vorwärts gilt: ${short(labels[i])} = 100 %, also ${fmt(B)} × ${rate} ÷ 100 = ${fmt(A)}.` };
    if (s.key === "ust") {
      const other = s.rate === 19 ? 7 : 19;
      if (near(a, pct(B, other))) return { cat: "ust", hint: `Sie haben mit ${other} % gerechnet. Für ${t.product.name} gilt ${s.rate} %: ${fmt(B)} × ${s.rate} ÷ 100 = ${fmt(A)}.` };
    }
    for (let j = 0; j < t.sol.vals.length; j++) {
      if (j === i) continue;
      const cand = pct(t.sol.vals[j], rate);
      if (near(a, cand) && !near(cand, A)) return { cat: "basis", hint: `Sie haben ${rate} % vom ${short(labels[j])} berechnet. Grundwert ist der ${short(labels[i])}: ${fmt(B)} × ${rate} ÷ 100 = ${fmt(A)}.` };
    }
    for (const f of [10, 100]) {
      if (near(a, A * f, f) || near(a * f, A, f)) return { cat: "prozent", hint: `Das Komma ist verrutscht. Richtig: ${fmt(B)} × ${rate} ÷ 100 = ${fmt(A)}.` };
    }
    if (near(a, A, 10)) return { cat: "runden", hint: `Knapp daneben. Rechnen Sie genau und runden Sie auf Cent: ${fmt(B)} × ${rate} ÷ 100 = ${fmt(A)}.` };
    return { cat: "prozent", hint: `So rechnen Sie: ${short(labels[i])} ${fmt(B)} × ${rate} ÷ 100 = ${fmt(A)}.` };
  }

  function diagResult(x, c) {
    const { P, aUsed, D, R, own } = c;
    const sign = D.op < 0 ? "−" : "+";
    if (near(x, P - D.op * aUsed) && aUsed > TOL) return { cat: "vorzeichen", hint: D.op < 0 ? `Den ${D.amount === "Liefererskonto" ? "Skonto" : "Rabatt"} ziehen Sie ab: ${fmt(P)} − ${fmt(aUsed)} = ${fmt(own)}.` : `${D.amount === "Gewinn" ? "Den Gewinn" : "Die " + D.amount} rechnen Sie dazu: ${fmt(P)} + ${fmt(aUsed)} = ${fmt(own)}.` };
    if (near(x, P)) return { cat: "zeile", hint: `Sie haben den Wert von oben übernommen, ohne den Betrag zu verrechnen: ${fmt(P)} ${sign} ${fmt(aUsed)} = ${fmt(own)}.` };
    if (near(x, aUsed)) return { cat: "zeile", hint: `Das ist der Betrag aus der Zeile darüber. Gesucht ist das neue Zwischenergebnis: ${fmt(P)} ${sign} ${fmt(aUsed)} = ${fmt(own)}.` };
    if (near(x, own, 10) || near(x, R, 10)) return { cat: "runden", hint: `Knapp daneben: ${fmt(P)} ${sign} ${fmt(aUsed)} = ${fmt(own)}.` };
    return { cat: "rechnen", hint: `Rechnen Sie nach: ${fmt(P)} ${sign} ${fmt(aUsed)} = ${fmt(own)}.` };
  }

  function ustHint(t, rate) {
    const p = t.product;
    if (rate === 7) return `${p.name} ist ein Lebensmittel. Dafür gilt der ermäßigte Satz von 7 %.`;
    if (t.branch === "lm") return `${p.name} ist ein Getränk. Getränke (außer Milch) haben 19 %.`;
    return `Bekleidung und Schuhe haben immer 19 %.`;
  }

  function evaluateTask(t, ans) {
    const labels = chainLabels(t);
    const out = { rows: [], pts: 0, max: 0, cats: {} };
    const add = row => {
      out.rows.push(row);
      out.max++;
      if (row.status === "ok" || row.status === "folge") out.pts++;
      else if (row.cat) out.cats[row.cat] = (out.cats[row.cat] || 0) + 1;
    };
    out.rows.push({ given: true, label: labels[0], correct: t.sol.vals[0] });
    let P = t.sol.vals[0];
    t.steps.forEach((s, i) => {
      const D = STEP[s.key];
      const B = t.sol.vals[i], A = t.sol.amts[i], R = t.sol.vals[i + 1];
      let rate = s.rate;
      if (s.key === "ust" && t.ustSelect) {
        const chosen = parseInt(ans.ust, 10);
        const row = { label: "Steuersatz", op: "", text: true, your: chosen ? chosen + " %" : "–", correct: s.rate + " %" };
        if (!chosen) { row.status = "empty"; row.cat = "leer"; row.hint = "Sie haben keinen Steuersatz gewählt."; }
        else if (chosen === s.rate) row.status = "ok";
        else { row.status = "wrong"; row.cat = "ust"; row.hint = ustHint(t, s.rate); rate = chosen; }
        add(row);
      }
      // Betrag
      const a = parseMoney(ans["a" + i]);
      const ownA = D.type === "fixed" ? A : pct(P, rate);
      const ar = { label: D.amount + (D.type === "rate" ? ` (${s.key === "ust" && t.ustSelect ? s.rate : rate} %)` : ""), op: D.op < 0 ? "−" : "+", your: a, correct: A };
      if (a === null) { ar.status = "empty"; ar.cat = "leer"; ar.hint = "Dieses Feld ist leer."; }
      else if (Number.isNaN(a)) { ar.status = "wrong"; ar.cat = "leer"; ar.hint = "Das ist keine gültige Zahl. Schreiben Sie zum Beispiel 12,50."; }
      else if (near(a, A)) ar.status = "ok";
      else if (near(a, ownA)) { ar.status = "folge"; ar.hint = `Richtig gerechnet mit Ihrem Wert darüber (${fmt(P)}). Der Fehler liegt weiter oben.`; }
      else { ar.status = "wrong"; Object.assign(ar, diagAmount(a, { s, D, A, R, B, rate, t, labels, i })); }
      add(ar);
      // Zwischenergebnis
      const aUsed = (a === null || Number.isNaN(a)) ? ownA : a;
      const own = P + D.op * aUsed;
      const x = parseMoney(ans["r" + i]);
      const rr = { label: D.result, op: "=", sum: true, your: x, correct: R };
      if (x === null) { rr.status = "empty"; rr.cat = "leer"; rr.hint = "Dieses Feld ist leer."; }
      else if (Number.isNaN(x)) { rr.status = "wrong"; rr.cat = "leer"; rr.hint = "Das ist keine gültige Zahl. Schreiben Sie zum Beispiel 12,50."; }
      else if (near(x, R)) rr.status = "ok";
      else if (near(x, own)) { rr.status = "folge"; rr.hint = `Richtig weitergerechnet: ${fmt(P)} ${D.op < 0 ? "−" : "+"} ${fmt(aUsed)} = ${fmt(own)}. Der Fehler liegt weiter oben.`; }
      else { rr.status = "wrong"; Object.assign(rr, diagResult(x, { P, aUsed, D, R, own })); }
      add(rr);
      P = (x === null || Number.isNaN(x)) ? own : x;
    });
    return out;
  }

  /* ================= Fortschritt ================= */
  function loadProgress() {
    try { const p = JSON.parse(localStorage.getItem(STORE_KEY)); if (p && typeof p === "object") return Object.assign({ passed: {}, best: {}, name: "", branch: "" }, p); } catch (e) {}
    return { passed: {}, best: {}, name: "", branch: "" };
  }
  function saveProgress() { try { localStorage.setItem(STORE_KEY, JSON.stringify(PROG)); } catch (e) {} }
  let PROG = loadProgress();
  const teacher = () => location.hash === "#lehrkraft";
  const unlocked = n => n === 1 || teacher() || !!PROG.passed[n - 1];

  /* ================= Zustand & Rendern ================= */
  let S = { screen: "home", level: 1, tasks: [], answers: [], idx: 0, help: false, warn: false, result: null, resetAsk: false };
  const app = document.getElementById("app");

  function render() {
    if (S.screen === "task") renderTask();
    else if (S.screen === "result") renderResult();
    else renderHome();
    window.scrollTo(0, 0);
  }

  function startLevel(n) {
    if (!unlocked(n) || !BRANCH_KEYS.includes(PROG.branch) || !PROG.name) return;
    S = { screen: "task", level: n, tasks: makeRound(n, PROG.branch), answers: [], idx: 0, help: false, warn: false, result: null };
    S.answers = S.tasks.map(() => ({}));
    render();
  }

  /* ---------- Startseite ---------- */
  const BRANCH_KEYS = ["lm", "bk", "mix"];
  const span = a => Math.min(...a) + "–" + Math.max(...a) + " %";
  function branchInfo(br) {
    if (!BRANCH_KEYS.includes(br)) return `<p class="pick-hint">Bitte wählen Sie zuerst Ihren Ausbildungsbetrieb. Die Aufgaben und Zahlen passen sich an diese Waren an.</p>`;
    const list = br === "mix" ? ["lm", "bk"] : [br];
    return `<div class="binfo">${list.map(k => {
      const B = BRANCHES[k];
      return `<div><span class="eyebrow">${B.label}</span><b>${B.company}, ${B.city}</b>
        <p><span class="muted">Waren:</span> ${B.products.map(p => esc(p.name)).join(", ")}</p>
        <p><span class="muted">Typische Werte:</span> Rabatt ${span(B.rabatt)}, Skonto ${span(B.skonto)}, Handlungskosten ${span(B.hk)}, Gewinn ${span(B.gewinn)}, Umsatzsteuer ${k === "lm" ? "7 % (Lebensmittel) oder 19 % (Getränke)" : "19 %"}</p></div>`;
    }).join("")}</div>`;
  }
  function startLabel(n, open, done) {
    if (!open) return "Gesperrt";
    if (!PROG.name) return "Erst Vornamen eingeben";
    if (!BRANCH_KEYS.includes(PROG.branch)) return "Erst Betrieb wählen";
    return done ? "Wiederholen" : "Stufe " + n + " üben";
  }
  function updateStartButtons() {
    const ready = !!PROG.name && BRANCH_KEYS.includes(PROG.branch);
    app.querySelectorAll("[data-start][data-open]").forEach(b => {
      const open = b.dataset.open === "true";
      b.disabled = !(open && ready);
      b.textContent = startLabel(+b.dataset.start, open, b.dataset.done === "true");
    });
    const h = document.getElementById("need-name"); if (h) h.hidden = !!PROG.name;
  }
  function renderHome() {
    const br = PROG.branch;
    const cards = LEVELS.map(L => {
      const open = unlocked(L.n), done = !!PROG.passed[L.n], best = PROG.best[L.n];
      let status;
      if (done) status = `<span class="chip good">Bestanden · ${best} %</span>`;
      else if (!open) status = `<span class="chip">Gesperrt · erst Stufe ${L.n - 1} bestehen</span>`;
      else if (best != null) status = `<span class="chip bad">Bisher ${best} % · nötig ${PASS} %</span>`;
      else status = `<span class="chip ok">Offen</span>`;
      return `<article class="tag${open ? "" : " locked"}">
        <div class="head"><span class="lvl">Stufe ${L.n} · ${L.name}</span>${status}</div>
        <h3>${L.title}</h3>
        <ul>${L.items.map(i => `<li>${i}</li>`).join("")}<li>${L.tasks} Aufgaben je Runde</li></ul>
        <div class="foot"><span class="muted" style="font-size:.9rem">Bestanden ab ${PASS} %</span>
        <button class="btn${done ? " ghost" : ""}" data-start="${L.n}" data-open="${open}" data-done="${done}">${startLabel(L.n, open, done)}</button></div>
      </article>`;
    }).join("");

    app.innerHTML = `<section class="screen">
      <div class="hero">
        <span class="eyebrow">Verkäufer/-in · 2. Ausbildungsjahr</span>
        <h1>Kalkulationstrainer Einzelhandel</h1>
        <p class="lead">Üben Sie die Vorwärtskalkulation: vom Angebot des Lieferers bis zum Preis im Regal. Füllen Sie das Kalkulationsblatt aus. Am Ende sehen Sie Ihre Fehler und was Sie noch üben sollten.</p>
      </div>
      <div class="setup">
        <div class="grp"><label for="name">Ihr Vorname (Pflichtfeld)</label><input id="name" type="text" autocomplete="given-name" maxlength="40" required aria-required="true" value="${esc(PROG.name || "")}" placeholder="z. B. Lena"></div>
        <div class="grp"><span class="lab" id="br-lab">Waren aus Ihrem Ausbildungsbetrieb</span>
          <div class="seg" role="group" aria-labelledby="br-lab">
            ${[["lm", "Lebensmittel"], ["bk", "Bekleidung"], ["mix", "Gemischt"]].map(([k, l]) => `<button data-branch="${k}" aria-pressed="${br === k}">${l}</button>`).join("")}
          </div></div>
      </div>
      <p class="pick-hint" id="need-name"${PROG.name ? " hidden" : ""}>Bitte geben Sie zuerst Ihren Vornamen ein. Er steht auf Ihrem Ergebnis.</p>
      ${branchInfo(br)}
      <div class="levels">${cards}</div>
      <div class="info">
        <div class="panel"><h2>So funktioniert es</h2>
          <ul>
            <li>Rechnen Sie jede Zeile und runden Sie auf Cent. Komma oder Punkt sind beide erlaubt.</li>
            <li>Erst wenn alle Felder einer Aufgabe ausgefüllt sind, geht es zur nächsten Aufgabe.</li>
            <li>Die Auswertung kommt am Ende der Runde.</li>
            <li>Bestehen Sie eine Stufe mit mindestens ${PASS} %, wird die nächste freigeschaltet.</li>
            <li>Jede Stufe können Sie beliebig oft wiederholen, auch nach dem Bestehen. Bestandene Stufen bleiben freigeschaltet.</li>
            <li>Rechnen Sie mit einem falschen Wert richtig weiter, ist das ein Folgefehler. Er kostet keinen weiteren Punkt.</li>
            <li>Ihr Fortschritt wird nur auf diesem Gerät gespeichert.</li>
          </ul></div>
        <div class="panel"><h2>Das Kalkulationsschema</h2>
          ${exampleSchema(br)}</div>
      </div>
      <div class="teacher">${S.resetAsk
        ? `<span>Fortschritt auf diesem Gerät wirklich löschen?</span><button class="btn ghost" data-act="reset-yes">Ja, löschen</button><button class="linkbtn" data-act="reset-no">Abbrechen</button>`
        : `<button class="linkbtn" data-act="reset">Fortschritt zurücksetzen</button>`}
        ${teacher() ? `<span class="chip ok">Lehrkraft-Ansicht: alle Stufen offen</span>` : ""}</div>
    </section>`;
    updateStartButtons();
  }

  function exampleSchema(br) {
    const t = br === "lm"
      ? { start: "lep", startValue: 1800, product: BRANCHES.lm.products[0], caption: "Bergkäse im Frischemarkt Kortmann",
          steps: [{ key: "rabatt", rate: 5 }, { key: "skonto", rate: 2 }, { key: "bezug", amount: 40 }, { key: "hk", rate: 25 }, { key: "gewinn", rate: 8 }, { key: "ust", rate: 7 }] }
      : { start: "lep", startValue: 4000, product: BRANCHES.bk.products[0], caption: "Jeans im Modehaus Brüggemann",
          steps: [{ key: "rabatt", rate: 15 }, { key: "skonto", rate: 2 }, { key: "bezug", amount: 80 }, { key: "hk", rate: 45 }, { key: "gewinn", rate: 15 }, { key: "ust", rate: 19 }] };
    t.sol = solve(t);
    const base = ["vom Listeneinkaufspreis", "vom Zieleinkaufspreis", t.product.per, "vom Bezugspreis", "vom Selbstkostenpreis", "vom Nettoverkaufspreis"];
    let h = `<p class="muted" style="font-size:.92rem">Beispiel: ${esc(t.caption)}, Preise ${t.product.per}</p><div class="schema"><div class="sr"><span class="o"></span><span>Listeneinkaufspreis</span><span class="v">${fmt(t.sol.vals[0])}</span></div>`;
    t.steps.forEach((s, i) => {
      const D = STEP[s.key];
      h += `<div class="sr"><span class="o">${D.op < 0 ? "−" : "+"}</span><span>${D.amount} <small>${s.rate ? s.rate + " % " : ""}${base[i]}</small></span><span class="v">${fmt(t.sol.amts[i])}</span></div>`;
      h += `<div class="sr sum"><span class="o">=</span><span>${D.result}</span><span class="v">${fmt(t.sol.vals[i + 1])}</span></div>`;
    });
    h += `</div>`;
    return h;
  }

  /* ---------- Übung ---------- */
  function renderTask() {
    const t = S.tasks[S.idx], L = LEVELS[t.level - 1], ans = S.answers[S.idx];
    const labels = chainLabels(t);
    const id = k => `f-${S.idx}-${k}`;
    const val = k => esc(ans[k] || "");
    const miss = S.warn || [];
    const input = (k, lab) => `<span class="field"><input id="${id(k)}" data-k="${k}"${miss.includes(k) ? ' class="missing" aria-invalid="true"' : ""} inputmode="decimal" autocomplete="off" spellcheck="false" aria-label="${esc(lab)} in Euro" value="${val(k)}"><span class="unit">€</span></span>`;

    let rows = `<div class="row given"><span class="op"></span><span class="lbl">${labels[0]}</span><span class="val">${fmt(t.startValue)}</span></div>`;
    t.steps.forEach((s, i) => {
      const D = STEP[s.key];
      let chip = "";
      if (s.key === "ust" && t.ustSelect) {
        chip = `<select id="${id("ust")}" data-k="ust" aria-label="Steuersatz"${miss.includes("ust") ? ' class="missing" aria-invalid="true"' : ""}><option value="">Satz?</option><option value="7"${ans.ust === "7" ? " selected" : ""}>7 %</option><option value="19"${ans.ust === "19" ? " selected" : ""}>19 %</option></select>`;
      } else if (D.type === "rate") chip = `<span class="chip">${s.rate} %</span>`;
      rows += `<div class="row"><span class="op">${D.op < 0 ? "−" : "+"}</span><span class="lbl"><label for="${id("a" + i)}">${D.amount}</label>${chip}</span>${input("a" + i, D.amount)}`;
      if (L.help) rows += `<div class="help">${D.type === "fixed" ? "Betrag aus dem Angebot übernehmen" : `${short(labels[i])} × ${s.rate} ÷ 100`}</div>`;
      rows += `</div>`;
      const last = i === t.steps.length - 1;
      rows += `<div class="row sum${last ? " final" : ""}"><span class="op">=</span><span class="lbl"><label for="${id("r" + i)}">${D.result}</label></span>${input("r" + i, D.result)}`;
      if (L.help) rows += `<div class="help">${short(labels[i])} ${D.op < 0 ? "−" : "+"} ${D.amount}</div>`;
      rows += `</div>`;
    });

    const dots = S.tasks.map((_, i) => `<span class="${i === S.idx ? "on" : isFilled(i) ? "done" : ""}"></span>`).join("");
    const isLast = S.idx === S.tasks.length - 1;
    const ready = missingKeys(S.idx).length === 0;

    app.innerHTML = `<section class="screen">
      <div class="topbar">
        <button class="linkbtn" data-act="home">← Übersicht</button>
        <span class="muted">Stufe ${L.n} · ${L.name} · Aufgabe ${S.idx + 1} von ${S.tasks.length}</span>
        <div class="dots" aria-hidden="true">${dots}</div>
      </div>
      <div class="work">
        <div class="offer">
          <span class="who">${BRANCHES[t.branch].company}, ${BRANCHES[t.branch].city}</span>
          <h2>${esc(t.product.name)}</h2>
          <p>${taskIntro(t)}</p>
          <dl class="facts">${taskFacts(t).map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join("")}</dl>
          <p class="goal">${taskGoal(t)}</p>
        </div>
        <div>
          <div class="sheet${S.help ? " show-help" : ""}" id="sheet">
            <div class="sheet-head"><h3>Kalkulationsblatt</h3>${L.help ? `<button class="linkbtn" data-act="help">${S.help ? "Rechenweg ausblenden" : "Rechenweg zeigen"}</button>` : `<span class="muted" style="font-size:.88rem">Beträge in Euro, auf Cent gerundet</span>`}</div>
            ${rows}
          </div>
          ${miss.length ? `<div class="warn stop" role="alert"><p><b>Bitte füllen Sie alle Felder aus.</b> ${miss.length === 1 ? "Ein Feld ist" : miss.length + " Felder sind"} noch leer oder enthalten keine gültige Zahl (z. B. 12,50). Erst dann geht es weiter.</p></div>` : ""}
          <div class="nav">
            <button class="btn ghost" data-act="prev" ${S.idx === 0 ? "disabled" : ""}>← Vorherige Aufgabe</button>
            ${isLast ? `<button class="btn${ready ? "" : " is-off"}" data-act="eval" id="next-btn" aria-disabled="${!ready}">Auswerten</button>` : `<button class="btn${ready ? "" : " is-off"}" data-act="next" id="next-btn" aria-disabled="${!ready}">Nächste Aufgabe →</button>`}
          </div>
        </div>
      </div>
    </section>`;
  }

  function fieldKeys(t) {
    const k = [];
    t.steps.forEach((s, i) => { if (s.key === "ust" && t.ustSelect) k.push("ust"); k.push("a" + i, "r" + i); });
    return k;
  }
  function isFilled(i) { return fieldKeys(S.tasks[i]).every(k => (S.answers[i][k] || "").trim() !== ""); }
  function missingKeys(i) {
    return fieldKeys(S.tasks[i]).filter(k => {
      const v = (S.answers[i][k] || "").trim();
      return !v || (k !== "ust" && Number.isNaN(parseMoney(v)));
    });
  }
  function blockIfMissing() {
    const m = missingKeys(S.idx);
    if (!m.length) return false;
    S.warn = m; renderTask();
    const el = app.querySelector(".missing"); if (el) el.focus();
    return true;
  }

  function evaluateRound() {
    const per = S.tasks.map((t, i) => evaluateTask(t, S.answers[i]));
    const pts = per.reduce((a, r) => a + r.pts, 0), max = per.reduce((a, r) => a + r.max, 0);
    const cats = {};
    per.forEach(r => Object.entries(r.cats).forEach(([c, n]) => { cats[c] = (cats[c] || 0) + n; }));
    const percent = Math.floor(pts / max * 100);
    const passed = percent >= PASS;
    const wasUnlocked = LEVELS.slice(1).map(L => unlocked(L.n));
    PROG.best[S.level] = Math.max(PROG.best[S.level] || 0, percent);
    if (passed) PROG.passed[S.level] = true;
    saveProgress();
    S.result = { per, pts, max, cats, percent, passed, newUnlock: passed && S.level < 4 && !wasUnlocked[S.level - 1], date: new Date().toLocaleDateString("de-DE") };
    S.screen = "result"; S.warn = false;
    render();
  }

  /* ---------- Auswertung ---------- */
  function renderResult() {
    const R = S.result, L = LEVELS[S.level - 1];
    const name = PROG.name ? esc(PROG.name) : "";
    const catList = Object.entries(R.cats).sort((a, b) => b[1] - a[1]);
    let verdict;
    if (R.passed) verdict = `<div class="verdict pass">Stufe ${L.n} bestanden! ${S.level < 4 ? (R.newUnlock ? `Stufe ${S.level + 1} ist jetzt freigeschaltet.` : `Stufe ${S.level + 1} ist offen.`) : "Sie haben alle Stufen geschafft."}</div>`;
    else verdict = `<div class="verdict fail">Noch nicht bestanden. Sie brauchen mindestens ${PASS} %. Sehen Sie sich unten Ihre Fehler an und wiederholen Sie die Übung.</div>`;

    const practice = catList.length ? catList.map(([c, n]) => `<div class="panel"><h3><span>${CATS[c].t}</span><span class="chip bad">${n}×</span></h3><p>${CATS[c].d}</p><div class="ex">${esc(CATS[c].ex)}</div></div>`).join("")
      : `<div class="panel"><h3>Keine Fehler</h3><p>Alles richtig gerechnet. Sehr gut!</p></div>`;

    const tasks = R.per.map((r, i) => {
      const t = S.tasks[i];
      const errs = r.max - r.pts;
      const rows = r.rows.map(row => {
        if (row.given) return `<div class="rr"><span class="o"></span><span class="l">${row.label}</span><span class="y">${fmt(row.correct)}</span><span class="c">${fmt(row.correct)}</span><span class="s"><span class="chip">gegeben</span></span></div>`;
        const yourTxt = row.text ? row.your : row.your === null ? "leer" : Number.isNaN(row.your) ? "ungültig" : fmt(row.your);
        const corrTxt = row.text ? row.correct : fmt(row.correct);
        const yc = row.status === "wrong" ? " wrong" : row.status === "empty" ? " empty" : "";
        const badge = { ok: `<span class="chip good">✓ richtig</span>`, folge: `<span class="chip ok" title="${esc(row.hint)}">Folgefehler ✓</span>`, wrong: `<span class="chip bad">✗ falsch</span>`, empty: `<span class="chip bad">✗ leer</span>` }[row.status];
        const hint = row.hint && row.status !== "folge" ? `<div class="hint">${row.cat ? `<b>${CATS[row.cat].t}</b>` : ""}${row.hint}</div>` : "";
        return `<div class="rr${row.sum ? " sum" : ""}"><span class="o">${row.op || ""}</span><span class="l">${row.label}</span><span class="y${yc}">${yourTxt}</span><span class="c">${corrTxt}</span><span class="s">${badge}</span>${hint}</div>`;
      }).join("");
      return `<details class="res"${errs ? " open" : ""}>
        <summary><span class="t">Aufgabe ${i + 1} · ${esc(t.product.name)}</span><span class="chip ${errs ? "bad" : "good"}">${r.pts} von ${r.max} Punkten</span></summary>
        <div class="res-body">
          <p class="muted" style="font-size:.92rem">${taskFacts(t).map(([k, v]) => `${k}: ${v}`).join(" · ")}</p>
          <div class="rt"><div class="rr head"><span></span><span>Position</span><span style="text-align:right">Ihre Eingabe</span><span style="text-align:right">Richtig</span><span></span></div>${rows}</div>
        </div></details>`;
    }).join("");

    const fill = Math.max(2, R.percent);
    app.innerHTML = `<section class="screen">
      <div class="topbar"><button class="linkbtn" data-act="home">← Übersicht</button><span class="muted">${name ? name + " · " : ""}${R.date}</span></div>
      <div class="score">
        <div><span class="eyebrow">Stufe ${L.n} · ${L.name}</span><div class="big">${R.percent} %</div><span class="muted">${R.pts} von ${R.max} Punkten</span></div>
        <div style="display:grid;gap:12px;min-width:0">
          <div><div class="meter" role="img" aria-label="${R.percent} Prozent erreicht, ${PASS} Prozent nötig"><i class="${R.passed ? "pass" : ""}" style="width:${fill}%"></i><b style="left:${PASS}%"></b></div>
          <div class="meter-l"><span>0 %</span><span>bestanden ab ${PASS} %</span><span>100 %</span></div></div>
          ${verdict}
        </div>
      </div>
      <div class="section"><h2>${catList.length ? "Das sollten Sie üben" : "Ergebnis"}</h2><div class="practice">${practice}</div></div>
      <div class="section"><h2>Ihre Aufgaben im Detail</h2><p class="muted"><span class="chip ok">Folgefehler ✓</span> bedeutet: Sie haben mit Ihrem falschen Wert von oben richtig weitergerechnet. Das zählt als richtig.</p>${tasks}</div>
      <div class="actions">
        ${R.passed && S.level < 4 ? `<button class="btn" data-start="${S.level + 1}">Weiter zu Stufe ${S.level + 1} →</button>` : ""}
        <button class="btn${R.passed && S.level < 4 ? " ghost" : ""}" data-act="same">Dieselben Aufgaben wiederholen</button>
        <button class="btn ghost" data-start="${S.level}">Neue Aufgaben auf Stufe ${S.level}</button>
        <button class="btn ghost" data-act="home">Zur Übersicht</button>
      </div>
    </section>`;
  }

  /* ================= Ereignisse ================= */
  app.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b || b.disabled) return;
    if (b.dataset.start) return startLevel(+b.dataset.start);
    if (b.dataset.branch) { PROG.branch = b.dataset.branch; saveProgress(); return renderHome(); }
    const act = b.dataset.act;
    if (act === "home") { S.screen = "home"; S.resetAsk = false; return render(); }
    if (act === "help") { S.help = !S.help; document.getElementById("sheet").classList.toggle("show-help", S.help); b.textContent = S.help ? "Rechenweg ausblenden" : "Rechenweg zeigen"; return; }
    if (act === "prev") { S.idx = Math.max(0, S.idx - 1); S.warn = false; return render(); }
    if (act === "next") { if (blockIfMissing()) return; S.warn = false; S.idx = Math.min(S.tasks.length - 1, S.idx + 1); return render(); }
    if (act === "eval") {
      if (blockIfMissing()) return;
      const open = S.tasks.findIndex((_, i) => missingKeys(i).length);
      if (open >= 0) { S.idx = open; renderTask(); return blockIfMissing(); }
      return evaluateRound();
    }
    if (act === "same") { S.answers = S.tasks.map(() => ({})); S.idx = 0; S.warn = false; S.result = null; S.screen = "task"; return render(); }
    if (act === "reset") { S.resetAsk = true; return renderHome(); }
    if (act === "reset-no") { S.resetAsk = false; return renderHome(); }
    if (act === "reset-yes") { const name = PROG.name, branch = PROG.branch; PROG = { passed: {}, best: {}, name, branch }; saveProgress(); S.resetAsk = false; return renderHome(); }
  });

  app.addEventListener("input", e => {
    const el = e.target;
    if (el.id === "name") { PROG.name = el.value.trim(); saveProgress(); updateStartButtons(); return; }
    if (el.dataset.k && S.screen === "task") { S.answers[S.idx][el.dataset.k] = el.value; refreshReady(el); }
  });
  function refreshReady(el) {
    const m = missingKeys(S.idx);
    if (el && !m.includes(el.dataset.k)) { el.classList.remove("missing"); el.removeAttribute("aria-invalid"); }
    if (Array.isArray(S.warn)) { S.warn = S.warn.filter(k => m.includes(k)); if (!S.warn.length) { S.warn = false; const w = app.querySelector(".warn"); if (w) w.remove(); } }
    const nb = document.getElementById("next-btn");
    if (nb) { nb.classList.toggle("is-off", m.length > 0); nb.setAttribute("aria-disabled", String(m.length > 0)); }
  }
  app.addEventListener("change", e => {
    const el = e.target;
    if (el.tagName === "SELECT" && el.dataset.k && S.screen === "task") { S.answers[S.idx][el.dataset.k] = el.value; refreshReady(el); }
  });
  app.addEventListener("keydown", e => {
    if (e.key !== "Enter" || S.screen !== "task" || !e.target.dataset.k) return;
    e.preventDefault();
    const els = [...app.querySelectorAll("#sheet [data-k]")];
    const n = els[els.indexOf(e.target) + 1];
    if (n) n.focus(); else { const nb = document.getElementById("next-btn"); if (nb) nb.focus(); }
  });
  window.addEventListener("hashchange", () => { if (S.screen === "home") renderHome(); });

  /* ================= Start ================= */
  window.claude?.hot?.snapshot?.(() => ({ S }));
  const boot = data => { if (data && data.S && data.S.screen) S = data.S; render(); };
  window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
